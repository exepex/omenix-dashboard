name: web-tests

# The web tier (web/, session B5): typecheck, the offline node tests (mocked MotherDuck, GitHub and Slack; the
# prompt-injection suite) and a production build. No secrets and no deploys: nothing here reaches Slack or Vercel.
# Install scripts are off (web/.npmrc ignore-scripts=true); the lockfile pins every package.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"     # >= 22.18: the tests run TypeScript through Node's type stripping
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (offline)
        run: npm test
      - name: Build
        run: npm run build

  # The UI harness (web/tests/ui/harness.mjs): every page and the app frame (W8) on the built app (`next start`) with
  # every /api/v1 read answered from fixtures, at the cases' widths: console errors, requests off the app's origin,
  # horizontal overflow, keyboard path, contrast. Playwright is pinned to the version the harness is written for.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Playwright and Chromium (pinned)
        run: |
          npm install --global playwright@1.56.1
          playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: UI harness
        run: node tests/ui/harness.mjs --out ../work/ui
      - name: Screenshots and report, on failure only (the full set is about 300 MB)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-harness
          path: work/ui
          retention-days: 7
