name: code-size

# Owner's engineering standard: no file over 350 lines (tools/check_code_size.mjs; inherited files may only shrink).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Code size
        run: node tools/check_code_size.mjs
