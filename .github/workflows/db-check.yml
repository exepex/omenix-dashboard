name: db-check

# Issue #2: hourly read-only check of omenix-pg for the owner's accepted exceptions (large objects in any database,
# drift such as a persistent statement_timeout). Logs in as db_monitor, which can read catalogs and large-object sizes
# only. Secrets (Settings > Secrets and variables > Actions): OMENIX_DB_MONITOR_PASSWORD and OMENIX_DB_ALERT_WEBHOOK
# (a Slack incoming webhook bound to #db-alerts, for the private details). Variable DB_CHECK_ENABLED=true (set by setup_monitor.sh): from
# then on a missing secret is UNKNOWN, never a silent pass. Never runs on pull requests, so no fork reaches a secret.
# The repository is public: the log and the alert issue carry only status, counts and the check time; details go to
# Slack only. On ALERT or UNKNOWN the run fails (GitHub e-mails the owner) and the issue "Database check: alert" is
# opened or commented. Details: platform/README.md, "Scheduled check".
on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write            # only to open or comment on the alert issue

concurrency:
  group: db-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PGHOST: omenix-pg.postgres.database.azure.com
      PGPORT: "5432"
      PGUSER: db_monitor
      PGSSLMODE: verify-full
      PGSSLROOTCERT: system      # the runner's trusted roots (libpq 16 or later)
      PGPASSWORD: ${{ secrets.OMENIX_DB_MONITOR_PASSWORD }}
      OMENIX_DB_ALERT_WEBHOOK: ${{ secrets.OMENIX_DB_ALERT_WEBHOOK }}
      DB_CHECK_ENABLED: ${{ vars.DB_CHECK_ENABLED }}
      PGCONNECT_TIMEOUT: "20"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          command -v psql > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql --version > /dev/null
          platform/monitor/run.sh "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
