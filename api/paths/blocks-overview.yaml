/api/v1/markets/{market}/overview/world:
  get:
    tags: [blocks]
    operationId: getWorld
    summary: 'World markets, currencies and commodities, each at its own last close'
    x-status: planned
    x-publisher: stock
    x-read-model: 'rm.blocks page_key world (K5-proposed)'
    x-freshness: 'stock_age; each instrument''s own close'
    x-cache: 'tag rm:blocks:<market>:world, revalidated on publish; browser private, no-cache + ETag'
    x-empty: 'quotes empty'
    x-feeds: [h34.period, h34.world]
    x-shared: 'one set of quotes; the period switch picks the change shown'
    parameters:
      - $ref: '#/components/parameters/Market'
    responses:
      '200':
        description: 'The World block'
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorldResponse'}
            examples:
              india: {$ref: '#/components/examples/getWorld_india'}
              us: {$ref: '#/components/examples/getWorld_us'}
      '404': {$ref: '#/components/responses/NotFound'}
      '501': {$ref: '#/components/responses/NotImplemented'}
      '503': {$ref: '#/components/responses/Unavailable'}
