# Story P1 (owner decision, 15 Oct 2026): the F&O data catalog's five screens, India only (absent in the US, not empty).
# Tag fno-screens: checked by tools/api/check_fno_screens.py (examples in three cases, Mock labels, Paper on money,
# visibility, the backend record behind every built field); the field tables are api/catalog/fno-screens.md (generated).
# Planned: each answers 501 until exepex/trading publishes the page (P2, P3) and W3 builds the screen.
/api/v1/markets/india/fno/card:
  get:
    tags: [fno-screens]
    operationId: getFnoCard
    summary: "The daily trade card, PAPER ONLY: TRADE, NO TRADE with its reason, or WATCH"
    x-status: planned
    x-publisher: fno
    x-read-model: 'fno.pages_history page card (P1 page; published by P2/P3 in the F&O publication)'
    x-freshness: 'fno_calendar; once a session day at card_sent_at (target 15:08 IST)'
    x-cache: 'keyed by publication_id; browser private, no-cache + ETag'
    x-empty: 'status NO TRADE, reason no_approved_strategy (the real state while no strategy has passed)'
    responses:
      '200':
        description: 'The FnoCard page'
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FnoCardResponse'}
            examples:
              india_trade: {$ref: '#/components/examples/getFnoCard_india_trade'}
              india_watch: {$ref: '#/components/examples/getFnoCard_india_watch'}
              india_red: {$ref: '#/components/examples/getFnoCard_india_red'}
              india_withheld: {$ref: '#/components/examples/getFnoCard_india_withheld'}
              india_missing: {$ref: '#/components/examples/getFnoCard_india_missing'}
              india_none: {$ref: '#/components/examples/getFnoCard_india_none'}
      '501': {$ref: '#/components/responses/NotImplemented'}
      '503': {$ref: '#/components/responses/Unavailable'}
