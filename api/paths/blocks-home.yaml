# Block endpoints of Home (31-dashboard) and the picks panel the frame shares with it. Each operation states the
# blocks it feeds (x-feeds).
/api/v1/markets/{market}/picks:
  get:
    tags: [blocks]
    operationId: getPicks
    summary: 'Today''s buy picks of the stock tool (agreement, record, go-live, no-pick list)'
    x-status: planned
    x-publisher: stock
    x-read-model: 'rm.blocks page_key picks (interim: rm.home head_to_head, agreement, go_live)'
    x-freshness: 'stock_age; pre-open run'
    x-cache: 'tag rm:blocks:<market>:picks, revalidated on publish; browser private, no-cache + ETag'
    x-empty: 'signals empty: "No pick today"; no_pick lists companies nobody buys'
    x-feeds: [h31.glance-pick, h31.picks-inline, s30.picks-agree, s30.picks-golive, s30.picks-nopick, s30.picks-record, s30.picks-row, s30.picks-yesno]
    x-shared: 'one list of picks: Home''s top pick is the first row of the same list'
    parameters:
      - $ref: '#/components/parameters/Market'
    responses:
      '200':
        description: 'The Picks block'
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PicksResponse'}
            examples:
              india: {$ref: '#/components/examples/getPicks_india'}
              us: {$ref: '#/components/examples/getPicks_us'}
      '404': {$ref: '#/components/responses/NotFound'}
      '501': {$ref: '#/components/responses/NotImplemented'}
      '503': {$ref: '#/components/responses/Unavailable'}
/api/v1/markets/{market}/tracked-moves:
  get:
    tags: [blocks]
    operationId: getTrackedMoves
    summary: 'How the tracked companies moved on the last close (market band)'
    x-status: planned
    x-publisher: stock
    x-read-model: 'rm.blocks page_key tracked_moves (interim: rm.companies)'
    x-freshness: 'stock_age; post-close run'
    x-cache: 'tag rm:blocks:<market>:tracked_moves, revalidated on publish; browser private, no-cache + ETag'
    x-empty: 'companies empty: the band leaves the line out'
    x-feeds: [h31.band]
    parameters:
      - $ref: '#/components/parameters/Market'
    responses:
      '200':
        description: 'The TrackedMoves block'
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrackedMovesResponse'}
            examples:
              india: {$ref: '#/components/examples/getTrackedMoves_india'}
              us: {$ref: '#/components/examples/getTrackedMoves_us'}
      '404': {$ref: '#/components/responses/NotFound'}
      '501': {$ref: '#/components/responses/NotImplemented'}
      '503': {$ref: '#/components/responses/Unavailable'}
