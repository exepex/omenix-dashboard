/api/v1/markets/{market}/screener/tools:
  get:
    tags: [blocks]
    operationId: getScreenerTools
    summary: 'The stock tool''s view of the companies it follows: strategies buying, the model''s chance, days to results'
    x-status: planned
    x-publisher: stock
    x-read-model: 'rm.blocks page_key screener_tools (K5-proposed; interim: rm.home agreement and model scores)'
    x-freshness: 'stock_age; pre-open run'
    x-cache: 'tag rm:blocks:<market>:screener_tools, revalidated on publish; browser private, no-cache + ETag'
    x-empty: 'a company with strategies.of 0 shows "No view today"'
    x-feeds: [h33.screens, h33.tools]
    x-shared: 'one view per followed company: the table''s tools column and the two tools-based chips'
    parameters:
      - $ref: '#/components/parameters/Market'
    responses:
      '200':
        description: 'The ScreenerTools block'
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScreenerToolsResponse'}
            examples:
              india: {$ref: '#/components/examples/getScreenerTools_india'}
              us: {$ref: '#/components/examples/getScreenerTools_us'}
      '404': {$ref: '#/components/responses/NotFound'}
      '501': {$ref: '#/components/responses/NotImplemented'}
      '503': {$ref: '#/components/responses/Unavailable'}
/api/v1/markets/india/fno/screener/summary:
  get:
    tags: [blocks]
    operationId: getFnoScreenerSummary
    summary: 'Counts over the F&O underlyings: the four build-ups and the F&O screens'
    x-status: planned
    x-publisher: nse_ingest
    x-read-model: 'nse.blocks page_key fno_screener_summary (proposed)'
    x-freshness: 'nse_calendar; daily'
    x-cache: 'keyed by the NSE ingest''s publication; responses private, max-age=300'
    x-empty: 'never empty on a trading day'
    x-feeds: [h33.buildup, h33.fno-screens, h33.tabs]
    x-shared: 'one set of counts over the same underlyings: the F&O tab''s count, the build-up tiles and the F&O chips'
    responses:
      '200':
        description: 'The FnoScreenerSummary block'
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FnoScreenerSummaryResponse'}
            examples:
              india: {$ref: '#/components/examples/getFnoScreenerSummary_india'}
      '501': {$ref: '#/components/responses/NotImplemented'}
      '503': {$ref: '#/components/responses/Unavailable'}
/api/v1/markets/india/fno/screener/rows:
  get:
    tags: [blocks]
    operationId: getFnoScreenerRows
    summary: 'A page of F&O underlyings with the future, open interest, build-up, ATM IV, put-call ratio and move priced in'
    x-status: planned
    x-publisher: nse_ingest
    x-read-model: 'nse.blocks page_key fno_screener_rows (proposed; the route filters, sorts and pages)'
    x-freshness: 'nse_calendar; daily'
    x-cache: 'keyed by the NSE ingest''s publication; responses private, max-age=300'
    x-empty: 'rows empty'
    x-feeds: [h33.fno-screens, h33.fno-table, h34.index-options]
    x-shared: 'one table of underlyings: the F&O table and chips filter it; the Markets index options are its four index rows (equal on the 12 Oct data)'
    parameters:
      - {name: screen, in: query, schema: {type: string, enum: [long_buildup, short_buildup, short_covering, long_unwinding, ivhigh, ivlow, oiup, index]}}
      - {name: symbols, in: query, description: 'Comma-separated underlyings, at most 50 (the Markets overview asks for NIFTY,BANKNIFTY,FINNIFTY,MIDCPNIFTY)', schema: {type: string, maxLength: 600}}
      - {name: sort, in: query, description: 'Default oi (open interest × future price); a leading minus sorts ascending', schema: {type: string, enum: [oi, fc, -fc, oc, -oc, ivr, -ivr, pcr, -pcr, mv, -mv]}}
      - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    responses:
      '200':
        description: 'The FnoScreenerRows block'
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FnoScreenerRowsResponse'}
            examples:
              india: {$ref: '#/components/examples/getFnoScreenerRows_india'}
              india_index_options: {$ref: '#/components/examples/getFnoScreenerRows_india_index_options'}
      '422': {$ref: '#/components/responses/Invalid'}
      '501': {$ref: '#/components/responses/NotImplemented'}
      '503': {$ref: '#/components/responses/Unavailable'}
