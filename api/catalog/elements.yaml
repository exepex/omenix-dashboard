# Every element of the two signed-off data contracts (design/mockups/30-shell/notes.md, 31-dashboard/notes.md; frozen
# 13 Oct 2026), with each backticked field token of its notes.md text and where it lands in the contract.
#   row:     the element's first cell, exactly as in notes.md (null for a prose section: then every backticked token of
#            that section, its heading included, belongs to the element)
#   fields:  t = the notes.md token; k = its key(s) in the contract (a property carries x-notes "<id>:<key>"). Two keys
#            only where notes.md itself names two publishers for the token (why says so).
#   other:   a token that is not a field (an example value, an enum value, a source the publisher column names)
#   static:  the element needs no data from an endpoint (fixed text, the reader's local choice, a mockup aid)
#   block:   the independent screen block the element belongs to (default: the element alone); used by criterion 2
# tools/api/check_mapping.py checks this file against notes.md (row text and tokens, both ways) and the contract.

