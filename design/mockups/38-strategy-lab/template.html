<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omenix · Strategy lab</title>
<meta name="description" content="The Strategy lab: which family of strategies (Rule-based, Hybrid, AI team) makes money on paper after every charge, and whether it is ready to be trusted with real money. Stocks and F&O each as its own book, with one total line of both (India), since the start and over any period: readiness checks, a leaderboard in simple and detailed views, one chart of every family against its comparison line, month by month, what drove the results, and the strategies inside each family. Real settled trades of 13 Oct 2026 and labelled Examples on future dates. Paper only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* 38-strategy-lab page layout only; every component is from design/system/components.css. Tokens only. */
.sec{margin-top:16px}
.sec-head{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font:600 16px/1.3 var(--md-ref-typeface-plain);margin:0}
.sec-head .sub{font-size:12.5px;color:var(--md-sys-color-on-surface-variant);flex:1 1 220px}
.muted{color:var(--md-sys-color-on-surface-variant)} .small{font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{margin:0 0 10px;max-width:100%;flex-wrap:wrap}
.lede{margin:4px 0 0;font-size:14px;max-width:820px}
.howto{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--md-sys-color-on-surface-variant);margin:10px 0 0}
.howto svg{width:16px;height:16px;flex:none;fill:currentColor;margin-top:1px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.step3{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:12px;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-lowest);box-shadow:var(--mb-card-shadow)}
.step3 b{display:block;font-size:13.5px}.step3 small{display:block;font-size:12.5px;color:var(--md-sys-color-on-surface-variant);margin-top:2px}
.assets{margin-top:10px;max-width:100%;flex-wrap:wrap}.assets button{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:8px 16px}.assets svg{width:18px;height:18px;fill:currentColor}
.firsts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.firsts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.leader{display:grid;gap:6px;align-content:start;padding:14px 16px;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low);border:1px solid var(--md-sys-color-surface-container-high);min-width:0}
.leader.first{border:2px solid var(--mb-color-up);background:color-mix(in srgb,var(--mb-color-up-container) 35%,var(--md-sys-color-surface-container-lowest))}
.leader.idle{border-style:dashed}.leader small{font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rank{font:700 13px/24px var(--md-ref-typeface-plain);min-width:34px;height:24px;text-align:center;border-radius:12px;background:var(--md-sys-color-surface-container-high)}
.leader.first .rank{background:var(--mb-color-up);color:var(--md-sys-color-on-primary)}
.big{font:700 22px/1.2 var(--md-ref-typeface-plain);font-variant-numeric:tabular-nums}.big .pl svg{width:22px;height:22px}
.pl{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}.pl svg{width:16px;height:16px;fill:currentColor;flex:none}.pl.pos,b.pos{color:var(--mb-color-up)}.pl.neg,b.neg{color:var(--mb-color-down)}
.lfacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.lfacts .mb-fact b{font-size:15px}
svg.plot.spark{width:100%;height:42px;display:block}
.plot .line{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}.plot .l1{stroke:var(--mb-chart-1)}.plot .l2{stroke:var(--mb-chart-2)}.plot .l3{stroke:var(--mb-chart-3)}
.plot .line.y{stroke:var(--md-sys-color-outline);stroke-dasharray:6 4}
.plot .zero{stroke:var(--md-sys-color-on-surface-variant);stroke-width:1}.plot .grid{stroke:var(--md-sys-color-surface-container-high);stroke-width:1}
.plot text{font:11px var(--md-ref-typeface-plain);fill:var(--md-sys-color-on-surface-variant)}
.plot .end{font:600 12px var(--md-ref-typeface-plain)}.plot .end.l1{fill:var(--mb-chart-1)}.plot .end.l2{fill:var(--mb-chart-2)}.plot .end.l3{fill:var(--mb-chart-3)}.plot .end.ly{fill:var(--md-sys-color-on-surface-variant)}
.plot .bar.l1{fill:var(--mb-chart-1)}.plot .bar.l2{fill:var(--mb-chart-2)}.plot .bar.l3{fill:var(--mb-chart-3)}
svg.plot.race{width:100%;height:auto;display:block;margin-top:8px;touch-action:pan-y}.plot .cross{stroke:var(--md-sys-color-outline);stroke-width:1}
.pchart{position:relative}.xtip{position:absolute;top:4px;left:84px;padding:4px 8px;border-radius:4px;background:var(--md-sys-color-inverse-surface);color:var(--md-sys-color-inverse-on-surface);font-size:12px;pointer-events:none;max-width:calc(100% - 92px)}.xtip[hidden]{display:none}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:6px}
.keys i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}.keys i.k1{background:var(--mb-chart-1)}.keys i.k2{background:var(--mb-chart-2)}.keys i.k3{background:var(--mb-chart-3)}
.keys i.ky{background:repeating-linear-gradient(90deg,var(--md-sys-color-outline) 0 5px,transparent 5px 8px)}
.checks{display:grid;gap:6px;padding-top:8px;border-top:1px solid var(--md-sys-color-surface-container-high)}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:13px}.chk small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant)}.chk .mb-mark{margin-top:1px}
.wl{display:grid;gap:4px}.wlbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--md-sys-color-surface-container)}.wlbar .won{background:var(--mb-color-up)}.wlbar .lost{background:var(--mb-color-down)}
.winner{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;font-size:14px}.winner svg{width:20px;height:20px;fill:var(--mb-color-up);flex:none}
.ptable .rk{font-weight:700;width:24px}.ptable tr.ref td{color:var(--md-sys-color-on-surface-variant)}
.pbar{display:flex;align-items:center;gap:8px}
.hbar{position:relative;display:block;width:90px;height:10px;flex:none;border-radius:3px;background:var(--md-sys-color-surface-container)}.hbar.wide{width:auto;min-width:60px}.hbar i{position:absolute;top:0;bottom:0;border-radius:3px}.hbar .pos{background:var(--mb-color-up)}.hbar .neg{background:var(--mb-color-down)}
.hbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--md-sys-color-outline)}
.acts.dates{margin:0 0 8px;align-items:flex-end}.acts.dates .mb-field{display:grid;gap:4px;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.months th,.months td{white-space:nowrap}.mcell{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.mcell.up.s1{background:color-mix(in srgb,var(--mb-color-up-container) 55%,var(--md-sys-color-surface-container-lowest))}.mcell.up.s2{background:var(--mb-color-up-container)}.mcell.up.s3{background:color-mix(in srgb,var(--mb-color-up) 22%,var(--mb-color-up-container))}
.mcell.down.s1{background:color-mix(in srgb,var(--mb-color-down-container) 55%,var(--md-sys-color-surface-container-lowest))}.mcell.down.s2{background:var(--mb-color-down-container)}.mcell.down.s3{background:color-mix(in srgb,var(--mb-color-down) 22%,var(--mb-color-down-container))}
.mcell.up{color:var(--mb-color-on-up-container)}.mcell.down{color:var(--mb-color-on-down-container)}.mcell.none{color:var(--md-sys-color-on-surface-variant);font-weight:400}
.story .big2{font-size:14px;font-weight:600;color:var(--md-sys-color-on-surface);margin:2px 0 0}
.meter{display:grid;gap:4px;padding-top:8px;border-top:1px solid var(--md-sys-color-surface-container-high)}.meter .k{font-size:12px;font-weight:600;color:var(--md-sys-color-on-surface-variant)}
.drv{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}.drv b{text-align:right;font-size:12.5px}
.mistake{display:flex;gap:6px;align-items:flex-start;margin:0;font-size:12.5px}.mistake .mb-mark{flex:none;margin-top:1px}
.linkcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;color:inherit}.linkcard b{display:block}.linkcard small{display:block;font-size:12.5px;color:var(--md-sys-color-on-surface-variant)}.linkcard>svg{width:22px;height:22px;fill:currentColor}
.scroll{overflow-x:auto}.md-table td small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.totals{list-style:none;margin:0;padding:0;display:grid;gap:8px}.totals li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px}
.src{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
table.pro thead{display:none}table.pro,table.pro tbody,table.pro tr,table.pro td{display:block;width:auto}table.pro tr{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(auto-fill,minmax(140px,1fr));gap:4px 12px;padding:10px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}table.pro td{border:0;padding:2px 0;text-align:left}table.pro td[data-k]::before{content:attr(data-k);display:block;color:var(--md-sys-color-on-surface-variant);font-size:11.5px}
@media (max-width:899px){table.stack thead{display:none}table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:auto}table.stack tr{padding:8px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}table.stack td{border:0;padding:2px 0;text-align:left}table.stack td[data-k]::before{content:attr(data-k) ": ";color:var(--md-sys-color-on-surface-variant);font-size:12px}.steps3{grid-template-columns:1fr}.firsts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1279px){table.months thead{display:none}table.months,table.months tbody{display:block}table.months tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:4px;padding:8px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}table.months th[scope=row]{grid-column:1 / -1;border:0;padding:0}table.months td{display:block;border:0;padding:4px 6px;border-radius:4px;white-space:normal}table.months td[data-k]::before{content:attr(data-k);display:block;font-size:11px;font-weight:400;color:var(--md-sys-color-on-surface-variant)}}
@media (max-width:599px){.firsts,.firsts.four{grid-template-columns:1fr}.lfacts{grid-template-columns:1fr 1fr}.drv{grid-template-columns:minmax(0,1fr) 60px}.drv .hbar{grid-column:1 / -1;grid-row:2}.md-table th,.md-table td{padding:8px 6px}}
</style>
</head>
