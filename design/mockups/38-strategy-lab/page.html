  .mb-mband .v { font-size: 15px; }
  .mb-sig-row .why { grid-column: 2 / -1; }
}

/* ---- option chain (design/mockups/32-option-chain; PLATFORM_DESIGN.md section 4 screen 6) ---------------------------
   .mb-oclook (answer cards: a question, its figure, its words; .mb-range for a priced-in range), .mb-chain (calls |
   strike | puts; the box is a size container, so columns drop by the room the table really has, with or without the
   picks panel), .mb-legtray (options picked to combine), the contract drawer's .mb-scen (buy and sell cases),
   .mb-facts / .mb-fact and .mb-drawer-sub, and svg.spark / svg.plot chart sizes. Column
   classes: .oc-l (drops under 1000 px of table), .oc-m (under 760 px), .oc-wide (under 520 px), .oc-narrow (only under 520 px). */
.mb-chain-box { container-type: inline-size; background: var(--md-sys-color-surface-container-lowest); border-radius: var(--mb-card-radius); box-shadow: var(--mb-card-shadow); }
.mb-chain { width: 100%; border-collapse: collapse; font: 13px/18px var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums; }
.mb-chain th { position: sticky; top: var(--mb-appbar-height); z-index: 2; background: var(--md-sys-color-surface-container); font: 600 11px/14px var(--md-ref-typeface-plain); letter-spacing: .04em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); padding: 8px 6px; text-align: right; white-space: nowrap; }
.mb-chain thead tr.side th { top: var(--mb-appbar-height); white-space: normal; font-size: 12px; letter-spacing: .02em; color: var(--md-sys-color-on-surface); background: var(--md-sys-color-surface-container-high); }
.mb-chain thead tr.cols th { top: calc(var(--mb-appbar-height) + 30px); }
.mb-chain th.p, .mb-chain td.p { text-align: left; }
.mb-chain th.k, .mb-chain td.k { text-align: center; width: 92px; }
.mb-chain td { padding: 6px; border-bottom: 1px solid var(--md-sys-color-surface-container-high); text-align: right; white-space: nowrap; position: relative; }
.mb-chain td small { display: block; font-size: 11px; line-height: 14px; color: var(--md-sys-color-on-surface-variant); }
.mb-chain td.itm { background: var(--md-sys-color-surface-container-low); }
.mb-chain td.k { font-weight: 700; background: var(--md-sys-color-surface-container); }
.mb-chain tr.atm td.k { box-shadow: inset 3px 0 0 var(--md-sys-color-primary), inset -3px 0 0 var(--md-sys-color-primary); }
.mb-chain td.k small { font-weight: 600; color: var(--md-sys-color-primary); }
.mb-chain td .muted { color: var(--md-sys-color-on-surface-variant); }
.mb-chain .oc-oi { isolation: isolate; }
.mb-chain .oc-oi::before { content: ""; position: absolute; z-index: -1; top: 4px; bottom: 4px; width: calc(var(--w, 0) * 1%); background: var(--mb-chart-1-fill); border-radius: 2px; }
.mb-chain td.c.oc-oi::before { right: 0; } .mb-chain td.p.oc-oi::before { left: 0; }
.mb-chain td.p.oc-oi::before { background: var(--mb-chart-2-fill); }
.mb-chain tr.oc-spot td { padding: 0; height: 22px; border-bottom: 0; background: linear-gradient(var(--md-sys-color-primary), var(--md-sys-color-primary)) center / 100% 2px no-repeat; }
.mb-chain tr.oc-spot td.k { background-color: transparent; }
.mb-chain tr.oc-spot td span { display: inline-block; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); font: 600 11px/18px var(--md-ref-typeface-plain); padding: 0 8px; border-radius: var(--md-sys-shape-corner-small); white-space: nowrap; }
.mb-chain td.oc-px { cursor: pointer; }
.mb-chain td.oc-px.sel { box-shadow: inset 0 0 0 2px var(--md-sys-color-primary); }
.mb-chain .oc-acts { position: absolute; top: 50%; transform: translateY(-50%); display: none; gap: 3px; z-index: 3; }
.mb-chain td.c .oc-acts { left: 4px; } .mb-chain td.p .oc-acts { right: 4px; }
.mb-chain tr:hover .oc-acts, .mb-chain td:focus-within .oc-acts { display: inline-flex; }
.mb-chain .oc-acts .mb-bs { width: 26px; height: 24px; }
.mb-chain .oc-acts .add { width: 26px; height: 24px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-small); background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-primary); display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
.mb-chain .oc-acts .add .ms { width: 16px; height: 16px; }
.mb-chain .oc-narrow { display: none; }
@container (max-width: 1000px) { .mb-chain .oc-l { display: none; } }
@container (max-width: 760px) { .mb-chain .oc-m { display: none; } }
@container (max-width: 520px) { .mb-chain .oc-wide { display: none; } .mb-chain .oc-narrow { display: block; } .mb-chain th.k, .mb-chain td.k { width: 76px; } .mb-chain .oc-acts { display: none !important; } }
.mb-legtray { margin: 0 0 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; background: var(--md-sys-color-surface-container-lowest); border-radius: var(--mb-card-radius); box-shadow: var(--mb-card-shadow); }
.mb-legtray .legs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 260px; min-width: 0; }
.mb-legtray .sum { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }
.mb-legtray .sum b { color: var(--md-sys-color-on-surface); font-size: 14px; }
.mb-oclook { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; }
.mb-oclook-card { display: grid; gap: 6px; align-content: start; padding: 14px 16px; border-radius: var(--mb-card-radius); background: var(--md-sys-color-surface-container-lowest); box-shadow: var(--mb-card-shadow); min-width: 0; }
.mb-oclook-card h2 { margin: 0; display: flex; align-items: center; gap: 6px; font: 600 13px/18px var(--md-ref-typeface-plain); color: var(--md-sys-color-on-surface-variant); }
.mb-oclook-card h2 .ms { width: 18px; height: 18px; color: var(--md-sys-color-primary); }
.mb-oclook-card .big { font: 700 22px/28px var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums; }
.mb-oclook-card .big .mb-delta { font-size: 14px; } .mb-oclook-card .big small { font-size: 14px; font-weight: 600; color: var(--md-sys-color-on-surface-variant); }
.mb-oclook-card p { margin: 0; font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface); }
.mb-oclook-card p.lead { font-size: 14px; line-height: 20px; } .mb-oclook-card p.muted { color: var(--md-sys-color-on-surface-variant); }
.mb-oclook-card .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mb-oclook-card .pair > div { display: grid; gap: 1px; min-width: 0; }
.mb-oclook-card .pair .k { font: 600 11px/16px var(--md-ref-typeface-plain); letter-spacing: .04em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); }

    storm.length ? el('div', {class: 'meter'}, el('span', {class: 'k'}, 'Calm and stormy markets'), el('small', {}, `In calm markets ${money(c, inStorm[0])} on ${calm.length} trades; in the stormy month ${money(c, inStorm[1])} on ${storm.length} (${basisWord()}).`)) : null,
    el('div', {class: 'meter'}, el('span', {class: 'k'}, 'Best and worst trade'), tradeLine(c, s.best, true), tradeLine(c, s.worst, false)));
}

/* one sentence on how the family makes its money: win rate against the size of wins and losses */
function storyLine(c, s, r, [cc, sc]) {
  const ratio = s.avgLoss ? Math.abs(s.avgLoss) / (s.avgWin || 1) : 0;
  let line = r.net >= 0 ? `Made ${money(c, r.net)} ${basisWord()}. ` : `Lost ${plain(c, r.net)} ${basisWord()}. `;
  if (s.rate >= 60 && ratio > 1.5) line += `It wins ${Math.round(s.rate)}% of its trades, but one loss wipes out about ${Math.round(ratio)} wins.`;
  else if (s.rate < 50 && s.net > 0) line += `It wins fewer than half its trades, but its wins are bigger than its losses.`;
  else if (s.net < 0 && s.rate >= 50) line += `It wins ${Math.round(s.rate)}% of its trades, but its losses are bigger than its wins.`;
  else if (s.net < 0) line += `It loses more trades than it wins (${s.lost} against ${s.won}).`;
  else line += `It wins ${Math.round(s.rate)}% of its trades, and its average win (${money(c, s.avgWin)}) covers its average loss (${money(c, s.avgLoss)}).`;
  if (sc < 0 && cc > 0) line += ` The stormy month cost it ${plain(c, sc)}.`;
  if (priced() && r.ai > Math.abs(r.trades) / 2 && r.ai > 0) line += ` Its AI and data costs (${plain(c, r.ai)}) took ${r.trades > 0 ? 'much of its trading profit' : 'it further into loss'}.`;
  return line;
}

function tradeLine(c, t, good) {
  if (!t) return null;
  const what = t[7] === 'fno' ? `${t[2]} on ${dayText(t[0])}, closed ${dayText(t[1])}` : `Traded ${t[2]} from ${dayText(t[0])} to ${dayText(t[1])}`;
  return c.el('p', {class: 'mistake'}, c.el('span', {class: 'mb-mark ' + (good ? 'hit' : 'miss'), 'aria-hidden': 'true'}, c.icon(good ? 'check' : 'close')),
    `${what}: ${money(c, t[3])}${t[7] === 'fno' ? '' : ` (${pct(t[4], 2)})`}. Main reason: ${(REASON[t[5]] || t[5]).toLowerCase()}.`);
}
/* Inside each family: its strategies (stocks) or what it traded (F&O), each with trades, win rate and profit, so a
   professional can see which part of a family carries it. The AI team is one team and is not split (owner, 13 Oct). */
function strategiesPart(main, c) {
  const {el} = c, fams = families().filter(f => tradesOf(c, f).length);
  const sec = el('section', {class: 'card sec', 'aria-label': 'Inside each family'}, head(c, 'Inside each family', 'which of its strategies made the money; since the start'));
  if (!fams.length) { sec.append(quiet(c, 'Empty: once trades close, each family’s strategies are listed here with their own trades, win rate and profit.')); main.append(sec); return; }
  if (!fams.includes(SF)) SF = fams[0];
  const groups = {};
  for (const t of tradesOf(c, SF)) { const k = t[7] === 'fno' ? `F&O: ${t[2]}` : t[6]; (groups[k] ||= []).push(t); }
  const rows = Object.entries(groups).map(([k, T]) => [k, stats(T)]).sort((a, b) => b[1].net - a[1].net), max = Math.max(1, ...rows.map(r => Math.abs(r[1].net)));
  sec.append(seg(c, 'Family', fams.map(f => [f, nameOf(f)]), SF, k => { SF = k; }),
    el('div', {class: 'scroll'}, el('table', {class: 'md-table ptable stack'}, el('thead', {}, el('tr', {}, el('th', {}, SF === 'ai' ? 'What it traded' : 'Strategy'), el('th', {}, 'Trades’ profit after market charges'), el('th', {class: 'num'}, 'Trades'), el('th', {class: 'num'}, 'Win rate'), el('th', {class: 'num'}, 'Per trade'))),
      el('tbody', {}, ...rows.map(([k, s]) => el('tr', {}, el('td', {}, k), el('td', {'data-k': 'Trades’ profit after market charges'}, el('span', {class: 'pbar'}, hbar(s.net, max, c), upDown(c, s.net, money(c, s.net)))),
        el('td', {class: 'num', 'data-k': 'Trades'}, String(s.n)), el('td', {class: 'num', 'data-k': 'Win rate'}, `${Math.round(s.rate)}%`), el('td', {class: 'num', 'data-k': 'Per trade'}, money(c, s.per))))))),
    howto(c, SF === 'ai' ? 'The AI team decides as one team, so it is shown by what it traded rather than by strategy. Results here are after market charges; its AI and data costs are in its total above.' : 'A family is only as good as its strategies together. These are the trades’ results after market charges: the owner’s own charges and the AI and data costs are paid by the family as a whole and are in its total above, not split by strategy.'));
  main.append(sec);
}

/* predictions are a side view: how well each family reads NIFTY, in the Forecast lab (F&O only; profit decides) */
function predictionsLink(main, c) {
  if (ASSET === 'stocks' || c.m !== 'india') return;
  main.append(c.el('a', {class: 'card sec linkcard', href: '../37-forecasts/page.html' + (EX ? '#ex=review' : '')}, c.el('span', {class: 'mb-avatar sm info'}, c.icon('query_stats')),
    c.el('span', {}, c.el('b', {}, 'How well each family reads the market'), c.el('small', {}, 'Every day each F&O family also predicts five things about NIFTY. The Forecast lab scores those predictions. It is a side view: profit decides, not predictions.')), c.icon('chevron_right')));
}
/* Mount last: every function and state the render uses is defined by now (files 1-8). */
PF.mount({screen: 'lab', group: 'strategies', strip: false, dataLabel: 'Real records of 13 Oct 2026 and labelled Examples',
  readHash(h) { EX = h.get('ex') in EXAMPLES ? h.get('ex') : null; ASSET = h.get('asset') in ASSETS ? h.get('asset') : 'stocks'; VIEW = h.get('view') === 'pro' ? 'pro' : 'simple';
    RANGE = RANGES.some(r => r[0] === h.get('range')) ? h.get('range') : '21'; FROM = h.get('from'); TO = h.get('to'); RV = VIEWS.some(v => v[0] === h.get('rv')) ? h.get('rv') : 'total';
    SF = h.get('sf') in AP ? h.get('sf') : 'rule'; PF.st.wlOff = h.get('wloff') !== '0'; },
  writeHash(h) { if (EX) h.set('ex', EX); if (ASSET !== 'stocks') h.set('asset', ASSET); if (VIEW !== 'simple') h.set('view', VIEW); if (RANGE !== '21') h.set('range', RANGE);
    if (RANGE === 'custom' && FROM && TO) { h.set('from', FROM); h.set('to', TO); } if (RV !== 'total') h.set('rv', RV); if (SF !== 'rule') h.set('sf', SF); if (!PF.st.wlOff) h.set('wloff', '0'); },
  render(main, c) {
    topPart(main, c); readyPart(main, c); boardPart(main, c); periodPart(main, c); monthsPart(main, c); whyPart(main, c); strategiesPart(main, c); predictionsLink(main, c);
    main.append(c.el('div', {class: 'src', role: 'note', 'aria-label': 'Where the figures come from'},
      c.el('span', {class: 'mb-asof', 'data-tip': 'contactexepex/agentic-stock-prediction data/<market>/paper_trades_settled'}, c.icon('schedule'), 'Stock tool: settled paper trades'),
      c.el('span', {class: 'mb-asof', 'data-tip': 'exepex/trading: paper books (slice 3)'}, c.icon('schedule'), 'F&O tool: paper books, not started'),
      c.el('span', {class: 'mb-tag mock', 'data-tip': 'Every number in the Example states is made up, on future dates.'}, 'Examples: made up'),
      c.el('span', {class: 'mb-tag', 'data-tip': 'Updated once a day after the close, not live.'}, 'Not live')));
  }});

</script>
