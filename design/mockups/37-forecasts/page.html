/* ---- formatting --------------------------------------------------------------------------------------------- */
const LOC = {INR: 'en-IN', USD: 'en-US'}, SYM = {INR: '₹', USD: '$'};
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const P = (m = st.m) => S.markets[m];
const cur = () => P().currency;
const num = (x, d = 2, c = cur()) => x == null ? '—' : Math.abs(x).toLocaleString(LOC[c], {minimumFractionDigits: d, maximumFractionDigits: d});
const money = (x, d = null, sign = false, c = cur()) => { if (x == null) return '—'; const dd = d == null ? (c === 'INR' ? 0 : 2) : d; return (x < 0 ? '−' : sign && x > 0 ? '+' : '') + SYM[c] + num(x, dd, c); };
const sgn = (x, d = 2, u = '%') => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d) + u;
const dir = x => x > 0 ? 'up' : x < 0 ? 'down' : 'flat';
const delta = (x, d = 2, u = '%') => x == null ? el('span', {class: 'muted'}, '—') : el('span', {class: 'mb-delta ' + dir(x)}, sgn(x, d, u));
const moneyDelta = (x, d = null, c = cur()) => x == null ? el('span', {class: 'muted'}, '—') : el('span', {class: 'mb-delta ' + dir(x)}, money(x, d, true, c));
const pad = n => String(n).padStart(2, '0');
const local = (iso, m = st.m) => new Date(Date.parse(iso) + P(m).offset_min * 60000);
const day = d => d.toISOString().slice(0, 10);
const hm = d => `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
const dateShort = (iso, m = st.m) => { const d = local(iso, m); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
function when(iso, m = st.m) { const d = local(iso, m), n = local(S.now, m); const z = P(m).zone; return day(d) === day(n) ? `${hm(d)} ${z}` : `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${hm(d)} ${z}`; }
const nowLabel = (m = st.m) => when(S.now, m);
/* as-of of an instrument: its source, the short stamp, stale when older than the source's own cadence allows */
function asOf(it) {
  const src = S.sources[it.source], d = local(it.as_of), n = local(S.now);
  const stale = (NOW - Date.parse(it.as_of)) / 3600000 > src.max_age_h;
  const short = it.source === 'eod' ? `EOD ${d.getUTCDate()} ${MON[d.getUTCMonth()]}` : it.source === 'snap3pm' ? (day(d) === day(n) ? '3 pm snap' : `3 pm ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`) : day(d) === day(n) ? hm(d) + ' ' + P().zone : `${d.getUTCDate()} ${MON[d.getUTCMonth()]} close`;
  return {short, stale, tip: `${src.label} (${src.detail}). As of ${when(it.as_of)}.${stale ? ' Stale: older than this source should be.' : ''}${it.note ? ' ' + it.note : ''} Not a live price.`};
}
const asOfEl = (it, withIcon = true) => { const a = asOf(it); return el('span', {class: 'mb-asof' + (a.stale ? ' stale' : ''), 'data-tip': a.tip}, withIcon ? icon(a.stale ? 'warning' : 'schedule') : null, a.short + (a.stale ? ' · stale' : '')); };
const item = id => P().items[id];
/* market session: open or closed now; your own buy and sell work only while it is open (owner, 13 Oct 2026). The
   strategies keep paper trading on their own schedule. #clock=open shows the same page during the session (example). */
function market(m = st.m) {
  const T = P(m).status, now = Date.parse(st.clock === 'open' ? T.example_open_now : S.now), o = Date.parse(T.open_utc), c = Date.parse(T.close_utc), z = P(m).zone;
  const at = iso => { const d = local(iso, m); return `${hm(d)} ${z}`; };
  if (now >= o && now < c) return {open: true, word: 'Open', text: `closes ${at(T.close_utc)}`};
  const next = now < o ? T.open_utc : T.next_open_utc;
  return {open: false, word: 'Closed', text: `opens ${now < o ? 'today' : dateShort(next, m)} ${at(next)}`, next};
}
const tradeLock = () => { const k = market(); return k.open ? null : `Market closed: you can buy and sell again when it ${k.text}. The strategies keep paper trading on their own.`; };

  svg.append(c.svgEl('line', {class: 'coin', x1: L, x2: W, y1: Y(0.25), y2: Y(0.25)}));
  for (const [id, pts] of lines) svg.append(c.svgEl('polyline', {class: 'line ' + (LINE[id] || 'y'), points: pts.map(([d, v]) => `${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}));
  for (const [d, a] of [[d0, 'start'], [d1, 'end']]) { const t = c.svgEl('text', {x: X(d), y: H - 4, 'text-anchor': a}); t.textContent = dayLabel(d); svg.append(t); }
  sec.append(svg, el('div', {class: 'keys'}, ...lines.filter(([id]) => isFamily(id)).map(([id]) => el('span', {}, el('i', {class: 'k' + LINE[id].slice(1)}), nameOf(id))),
    el('span', {}, el('i', {class: 'ky'}), 'Yardsticks'), el('span', {}, el('i', {class: 'kc'}), '0.25: always saying 50%')), missHow(c));
  return sec;
}

function missHow(c) {
  return howto(c, 'Miss score: the gap between the chance given and what happened, squared. 0 is perfect; 0.25 is what always saying 50% earns; 1 is “100% sure” and wrong. Below the dotted line means better than always saying 50%.');
}

/* head-to-head: the average gap in miss score with its 95% range; left of the centre line favours the first named */
function h2hCard(c, S, q, B) {
  const {el} = c, sec = el('section', {class: 'card sec', 'aria-label': 'Head to head'}, head(c, 'Head to head', 'every test of this question, as fixed before any score existed'));
  if (!B) return sec.append(el('div', {class: 'quiet'}, 'Empty: nothing to compare yet. Each family will be tested against the other families and against this question’s two yardsticks: 9 tests per question, 45 in all.')), sec;
  const rows = B.comparisons, span = Math.max(0.02, ...rows.filter(r => r.ci).flatMap(r => r.ci.map(Math.abs)));
  sec.append(el('div', {class: 'h2h-ends', 'aria-hidden': 'true'}, el('span', {}, ''), el('span', {}, el('span', {}, '◀ first named misses less'), el('span', {}, 'second misses less ▶')), el('span', {}, '')));
  sec.append(el('div', {class: 'h2h'}, ...rows.map(r => el('div', {class: 'h2h-row'},
    el('span', {}, el('b', {}, `${nameOf(r.a)} vs ${nameOf(r.b)}`), el('small', {}, r.n_dates ? `${r.n_dates} settled days` : 'no shared days yet')),
    r.ci ? gapBar(c, r, span) : proof(c, r.n_dates),
    verdictEl(c, r.verdict, sub(r))))));
  sec.append(howto(c, 'The dot is the average gap in miss score; the bar is its likely range. Left of the centre line: the first named misses less; right: the second does. A bar crossing the centre line could be luck. Only the first review gives verdicts, after a strict correction for running 45 tests at once.'));
  return sec;
}

function sub(r) {
  if (r.verdict === 'not_running') return 'one side has no forecasts';
  if (r.verdict === 'too_few_dates') return `${r.n_dates} of ${D.rules.min_dates} days`;
  if (r.verdict === 'before_review') return 'shown, not judged, until the first review';
  return r.mean_diff == null ? '' : `gap ${r.mean_diff > 0 ? '+' : '−'}${Math.abs(r.mean_diff).toFixed(3)}`;
}

function gapBar(c, r, span) {
  const W = 300, X = v => W / 2 + v / span * (W / 2 - 6), cls = r.verdict === 'better' ? 'good' : r.verdict === 'worse' ? 'bad' : 'flat';
  const svg = c.svgEl('svg', {viewBox: `0 0 ${W} 26`, role: 'img', class: 'plot', 'aria-label': `Average gap ${r.mean_diff.toFixed(3)}, likely between ${r.ci[0].toFixed(3)} and ${r.ci[1].toFixed(3)}`});
  svg.append(c.svgEl('line', {class: 'zero', x1: W / 2, x2: W / 2, y1: 2, y2: 24}), c.svgEl('line', {class: 'ci ' + cls, x1: X(r.ci[0]), x2: X(r.ci[1]), y1: 13, y2: 13}),
    c.svgEl('circle', {class: 'mean', cx: X(r.mean_diff), cy: 13, r: 4}));
  return svg;
}
/* The details of one question: is each forecaster honest about its confidence (calibration), the latest settled
   forecasts with hit or miss, every number in a table; then how the contest works, in plain words. */
function detailPart(main, c) {
  const S = state(), q = question(), B = S.questions[q.id];
  main.append(c.el('div', {class: 'grid2 sec'}, calibCard(c, S, q, B), settledCard(c, B)), numbersCard(c, q, B), howItWorks(c));
}

/* calibration: when a forecaster said about 70%, did it happen about 70% of the time? dots on the line are honest */
function calibCard(c, S, q, B) {
  const {el} = c, ids = [...D.families.map(f => f.id), ...q.yardsticks].filter(id => B && B.scores[id]);
  const sec = el('section', {class: 'card', 'aria-label': 'Honest about its confidence'}, head(c, 'Honest about its confidence?', 'said chance against how often it happened'));
  if (!ids.length) return sec.append(el('div', {class: 'quiet'}, 'Empty: needs settled forecasts. Each dot will compare a chance given (say 70%) with how often “yes” then happened.')), sec;
  if (!ids.includes(WHO)) WHO = ids[0];
  sec.append(seg(c, 'Forecaster', ids.map(id => [id, nameOf(id)]), WHO, k => { WHO = k; }));
  const bins = B.scores[WHO].calibration.filter(b => b.n), W = 260, P = 30, X = v => P + v * (W - P - 8), Y = v => 8 + (1 - v) * (W - P - 8);
  const svg = c.svgEl('svg', {viewBox: `0 0 ${W} ${W}`, class: 'plot', style: 'max-width:300px;display:block', role: 'img', 'aria-label': bins.map(b => `said ${chance(b.mean_p)}, happened ${chance(b.freq)} (${b.n} days)`).join('; ')});
  for (const v of [0, 0.5, 1]) { const t = c.svgEl('text', {x: X(v), y: W - 10, 'text-anchor': 'middle'}); t.textContent = chance(v); const u = c.svgEl('text', {x: 0, y: Y(v) + 4}); u.textContent = chance(v); svg.append(t, u); }
  svg.append(c.svgEl('line', {class: 'diag', x1: X(0), y1: Y(0), x2: X(1), y2: Y(1)}));
  const most = Math.max(...bins.map(b => b.n));
  for (const b of bins) svg.append(c.svgEl('circle', {class: 'dot', cx: X(b.mean_p), cy: Y(b.freq), r: (3 + 7 * Math.sqrt(b.n / most)).toFixed(1)}));
  sec.append(svg, el('p', {class: 'small', style: 'margin:6px 0 0'}, calibWords(bins)),
    howto(c, 'Each dot is a group of days with similar chances; bigger dots hold more days. On the dashed line: honest. Dots flatter than the line: too sure of itself. Steeper: too timid.'));
  return sec;
}

function calibWords(bins) {
  const sure = bins.filter(b => b.mean_p >= 0.7 || b.mean_p < 0.3).sort((a, b) => b.n - a.n)[0];
  if (!sure) return `${nameOf(WHO)} rarely gives a strong chance: most of its forecasts sit between 30% and 70%.`;
  const gap = Math.round(Math.abs(sure.mean_p - sure.freq) * 100);
  return `When ${nameOf(WHO)} said about ${chance(sure.mean_p)}, “yes” happened ${chance(sure.freq)} of the time (${sure.n} days): ${gap <= 10 ? 'close to honest' : `${gap} points off, so ${(sure.mean_p - 0.5) * (sure.mean_p - sure.freq) > 0 ? 'too sure of itself' : 'too timid'}`}.`;
}

/* the latest settled days: each family's chance, what happened, and its miss score */
function settledCard(c, B) {
  const {el} = c, sec = el('section', {class: 'card', 'aria-label': 'Latest settled forecasts'}, head(c, 'Latest settled forecasts', 'newest first'));
  if (!B || !B.recent.length) return sec.append(el('div', {class: 'quiet'}, B ? `Empty: the first answer is known on ${dayLabel(B.resolves - B.made + 1)}.` : 'Empty: no answer is known yet. Each settled day will show what every family said, what happened, and its miss score.')), sec;
  sec.append(el('ul', {class: 'settled'}, ...B.recent.map(r => el('li', {}, el('b', {}, dayLabel(r.day)),
    el('span', {class: 'said'}, ...D.families.filter(f => f.id in r.said).map(f => { const p = r.said[f.id], hit = p != null && (p >= 0.5) === (r.outcome === 1);
      return el('span', {'data-tip': p == null ? 'No forecast that day: counted as missed, never scored' : `Miss score ${miss((p - r.outcome) ** 2)}`}, c.apBadge(AP[f.id]), p == null ? 'no forecast' : chance(p),
        p == null ? null : el('span', {class: 'mb-mark ' + (hit ? 'hit' : 'miss'), 'aria-label': hit ? 'leaned the right way' : 'leaned the wrong way'}, c.icon(hit ? 'check' : 'close'))); })),
    el('span', {class: 'mb-label ' + (r.outcome ? 'success' : 'neutral')}, r.outcome ? 'Happened' : 'Did not happen')))));
  sec.append(howto(c, 'Tick: the family leaned the right way (above 50% and it happened, or below 50% and it did not). The miss score, in the tooltip, also counts how sure it was.'));
  return sec;
}

/* every number of this question in one table (the report fields of story G4) */
function numbersCard(c, q, B) {
  const {el} = c, ids = [...D.families.map(f => f.id), ...q.yardsticks];
  const row = id => { const s = B && B.scores[id], sp = s && s.split;
    const td = (k, v, small) => el('td', {class: 'num', 'data-k': k}, v, small ? el('small', {}, small) : null);
    return el('tr', {}, el('td', {}, who(c, id)), td('Forecasts', s ? String(s.n_forecasts) : '—'), td('Missed days', s ? String(s.n_no_forecast) : '—'),
      td('Settled', s ? String(s.n_scored) : '—'), td('Miss score', s ? miss(s.brier) : '—'), td('Log score', s ? miss(s.log) : '—'),
      q.id.startsWith('q5') ? td('Exact / estimated option price', sp ? `${miss(sp.interpolated.brier)} / ${miss(sp.flagged.brier)}` : '—', sp ? `${sp.interpolated.n} / ${sp.flagged.n} days` : null) : null); };
  return el('details', {class: 'md-expansion sec'}, el('summary', {}, 'All the numbers for this question'),
    el('div', {class: 'inner'}, el('div', {class: 'scroll'}, el('table', {class: 'md-table stack'},
      el('thead', {}, el('tr', {}, el('th', {}, 'Forecaster'), el('th', {class: 'num'}, 'Forecasts'), el('th', {class: 'num'}, 'Missed days'), el('th', {class: 'num'}, 'Settled'),
        el('th', {class: 'num'}, 'Miss score'), el('th', {class: 'num'}, 'Log score'), q.id.startsWith('q5') ? el('th', {class: 'num'}, 'Miss score: exact / estimated option price') : null)),
      el('tbody', {}, ...ids.map(row)))),
      el('p', {class: 'small muted', style: 'margin:8px 0 0'}, `Lower is better for both scores. The log score punishes being very sure and wrong harder; it is shown, not tested.${B && B.void ? ` ${B.void} day had no answer (data missing) and is never scored.` : ''}${q.id.startsWith('q5') ? ' Question 5: on some days the 30-day option price has to be estimated from one expiry; those days are scored apart.' : ''}`)));
}

function howItWorks(c) {
  const {el} = c;
  return el('details', {class: 'md-expansion sec'}, el('summary', {}, 'How the contest works'), el('div', {class: 'inner'},
    el('p', {class: 'small', style: 'margin:0'}, 'Every trading day, before 15:00 IST, each family and yardstick gives its chance of “yes” for these five questions. A forecast can never be changed, and a missing one is counted, never guessed.'),
    el('div', {class: 'qcards'}, ...D.questions.map((x, i) => el('div', {class: 'mb-fact'}, el('span', {class: 'k'}, `${i + 1}. ${x.short} · ${x.days} trading days`), el('b', {}, x.plain)))),
    el('p', {class: 'small', style: 'margin:14px 0 0'}, el('b', {}, 'The yardsticks. '), 'A family is only useful if it beats what simple methods already say:'),
    el('div', {class: 'qcards'}, ...D.yardsticks.map(y => el('div', {class: 'mb-fact'}, el('span', {class: 'k'}, y.only), el('b', {}, y.name), el('small', {}, y.plain)))),
    el('p', {class: 'small', style: 'margin:14px 0 0'}, el('b', {}, 'When is a lead real? '), `A test needs at least ${D.rules.min_dates} settled days. Neighbouring days share most of their 20-day window, so the range of each gap is worked out on ${D.rules.block_days}-day blocks. With ${D.rules.comparisons} tests run at once, some would look good by luck, so the bar for “proven” is raised to match. No verdict is given before ${D.rules.review}.`),
    el('p', {class: 'small muted', style: 'margin:8px 0 0'}, 'The rules were fixed before any score existed and cannot change after; a change would start a new version of the contest.')));
}
/* Mount last: every function and state the render uses is defined by now (files 1-5). */
PF.mount({screen: 'forecasts', group: 'strategies', strip: false, dataLabel: 'Real state of 13 Oct 2026 (no forecast yet) and labelled Examples',
  readHash(h) { EX = h.get('ex') in EXAMPLES ? h.get('ex') : null; Q = Math.min(4, Math.max(0, (+h.get('q') || 1) - 1));
    WHO = h.get('who') in AP || D.yardsticks.some(y => y.id === h.get('who')) ? h.get('who') : 'book1_rules'; PF.st.wlOff = h.get('wloff') !== '0'; },
  writeHash(h) { if (EX) h.set('ex', EX); if (Q) h.set('q', Q + 1); if (WHO !== 'book1_rules') h.set('who', WHO); if (!PF.st.wlOff) h.set('wloff', '0'); },
  render(main, c) {
    if (!c.P.fno) { location.replace('../31-dashboard/page.html#m=' + c.m); return; }   /* India only: absent in the US */
    topPart(main, c); board(main, c); questionPart(main, c); detailPart(main, c);
    main.append(c.el('div', {class: 'src', role: 'note', 'aria-label': 'Where the figures come from'},
      c.el('span', {class: 'mb-asof', 'data-tip': 'exepex/trading research/forecasts/PROTOCOL.md, draft version 1'}, c.icon('schedule'), 'F&O tool: forecast protocol, draft 1'),
      c.el('span', {class: 'mb-tag mock', 'data-tip': 'Every number in the Example states is made up; no real NIFTY or India VIX result is used.'}, 'Examples: made up'),
      c.el('span', {class: 'mb-tag', 'data-tip': 'Scores are worked out once a day after NSE’s close, not live.'}, 'Not live')));
  }});

</script>
