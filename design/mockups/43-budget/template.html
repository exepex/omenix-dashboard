<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omenix · AI usage and budget</title>
<meta name="description" content="This month's AI minutes against the budget cap and its level, by kind of work. Every state is a Mock example from the F&amp;O data catalog. India, F&amp;O only. Research and paper only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* 43-budget page layout only; every component is from design/system/components.css. Tokens only. */
.lede{margin:4px 0 0;font-size:14px;max-width:820px}
.muted{color:var(--md-sys-color-on-surface-variant)} .small{font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.qpick{max-width:100%;flex-wrap:wrap}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.stack{display:grid;gap:16px;min-width:0;margin-top:16px}
.card.sec{padding:16px 18px;min-width:0}
.sec h2{font:600 16px/1.3 var(--md-ref-typeface-plain);margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.facts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cap{display:grid;gap:4px;margin-top:10px}
.cap .bar{position:relative;height:12px;border-radius:3px;background:var(--md-sys-color-surface-container)}
.cap .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--mb-color-down)}
.legs{display:flex;flex-wrap:wrap;gap:4px}
.legs code{font-size:11.5px;padding:2px 6px;border-radius:3px;background:var(--md-sys-color-surface-container);overflow-wrap:anywhere}
.fills{display:flex;flex-wrap:wrap;gap:4px}
.src{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.md-table td small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.empty{font-size:13.5px;margin:0}
.cap .bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--md-sys-color-on-surface)}
@media (max-width:1439px){table.tstack thead{display:none}table.tstack,table.tstack tbody,table.tstack tr,table.tstack td{display:block;width:auto}table.tstack tr{padding:8px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}table.tstack td{border:0;padding:2px 0;text-align:left}table.tstack td[data-k]::before{content:attr(data-k) ": ";color:var(--md-sys-color-on-surface-variant);font-size:12px}table.tstack td small{display:inline;margin-left:6px}}
@media (max-width:1099px){.books{grid-template-columns:1fr}}
@media (max-width:599px){.md-table th,.md-table td{padding:8px 6px;white-space:normal}}
</style>
</head>
<body>
