<script>
/* 43-budget page runtime: AI usage against the budget cap (minutes, never a model name), drawn from the F&O data catalog's Mock
   examples (contract 2.8.0; story W3). Split by purpose: 1 state and helpers, 2 the page, 9 mount.
   The screen computes nothing beyond drawing: every figure is the payload's. Tokens only; never colour alone. */
let KEY = null;
/* URL: s (a state key of data.json); the default is the good case */
const KEYS = Object.keys(D.states);
const DEFAULT = KEYS.find(k => D.states[k].case === 'positive') || KEYS[0];
const CASE = {positive: 'Good case', negative: 'Bad case', empty: 'Empty case'};

function now() { return D.states[KEY || DEFAULT]; }
function pay() { return now().value.payload; }
function rs(c, x) { return c.money(x, 0, false, 'INR'); }
function signed(c, x) { return (x > 0 ? '+' : x < 0 ? '−' : '') + rs(c, Math.abs(x)); }
function dlabel(iso) { return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'}); }
function sec(c, title, ...kids) { return c.el('section', {class: 'card sec', 'aria-label': typeof title === 'string' ? title : null}, c.el('h2', {}, title), ...kids); }
function howto(c, text) { return c.el('p', {class: 'howto'}, c.icon('help'), c.el('span', {}, text)); }
function fact(c, k, v, small) { return c.el('div', {class: 'mb-fact'}, c.el('span', {class: 'k'}, k), c.el('b', {}, v), small ? c.el('small', {}, small) : null); }
function family(c, f) { const F = SHELL.families[f]; return c.el('span', {class: 'md-chip small'}, c.icon(F.icon), F.label); }
/* a profit or loss always with its sign, glyph and word, never colour alone */
function pnlLabel(c, x) {
  const [cls, g, w] = x > 0 ? ['success', 'trending_up', 'Up'] : x < 0 ? ['danger', 'trending_down', 'Down'] : ['neutral', 'trending_flat', 'Flat'];
  return c.el('span', {class: 'mb-label ' + cls}, c.icon(g), `${w} ${signed(c, x)}`);
}
function topPart(main, c, crumb, title, lede, tag) {
  const {el} = c;
  main.append(c.pagehead({crumbs: [['F&O'], [crumb]], title,
    meta: [el('span', {class: 'md-chip small'}, c.icon('public'), 'India · F&O'), tag ? c.paperTag() : null,
      el('span', {class: 'mb-tag mock', 'data-tip': 'Made-up numbers on a future date, from the F&O data catalog; never a real record.'}, 'Mock')].filter(Boolean)}));
  main.append(el('p', {class: 'lede'}, lede),
    el('div', {class: 'acts'}, el('span', {class: 'small muted'}, 'Mock state:'),
      el('div', {class: 'md-segmented dense qpick', role: 'group', 'aria-label': 'Mock state'}, ...KEYS.map(k => el('button', {type: 'button', 'aria-pressed': String(k === (KEY || DEFAULT)), 'data-tip': D.states[k].summary.replace(/^Mock \(india\): /, ''), onclick: () => { KEY = k; c.rerender(); }},
        CASE[D.states[k].case])))));
}
function srcLine(c, op, tip) {
  return c.el('div', {class: 'src', role: 'note', 'aria-label': 'Where the figures come from'},
    c.el('span', {class: 'mb-asof', 'data-tip': 'api/examples/fno-screens.json, operation ' + op}, c.icon('schedule'), 'F&O data catalog: ' + op),
    c.el('span', {class: 'mb-tag mock', 'data-tip': tip}, 'Mock: made up'));
}
/* The month's minutes against the cap (a bar with the 80% alert mark), the level with its meaning, and the minutes by
   kind of work. Minutes only: no model name, no session. */
const LEVEL = {ok: ['success', 'check', 'Within budget'], alert: ['warn', 'warning', 'Alert: 80% of the cap used'], stop: ['danger', 'block', 'Stop: the cap is reached'], unknown: ['neutral', 'help', 'Unknown']};
const GROUP = {ai_books: 'AI books (forecasts)', ai_roles: 'AI roles (desk meeting)', post_mortem: 'Weekly post-mortem', data_routines: 'Data routines', development: 'Building the tool'};
function mins(x) { return `${Math.round(x).toLocaleString('en-IN')} min`; }
function budgetPart(main, c) {
  const {el} = c, B = pay(), [cls, g, w] = LEVEL[B.level], pct = B.pct_of_cap;
  main.append(el('div', {class: 'stack'},
    sec(c, ['AI books and roles this month', el('span', {class: 'mb-label ' + cls}, c.icon(g), w)],
      el('div', {class: 'facts2'}, fact(c, 'Used', mins(B.books_and_roles_minutes), `in ${B.month}`), fact(c, 'Cap', mins(B.cap_minutes), `half of ${mins(B.basis_minutes)} ${B.basis === 'plan' ? 'in your plan' : 'measured'}`)),
      el('div', {class: 'cap'}, el('div', {class: 'bar', role: 'img', 'aria-label': pct == null ? 'Nothing to measure yet' : `${pct.toFixed(0)}% of the cap used; the alert is at 80%`},
        pct == null ? null : el('i', {style: `width:${Math.min(100, pct).toFixed(1)}%`}), el('span', {class: 'tick', style: 'left:80%'})),
        el('small', {class: 'muted'}, pct == null ? 'Nothing to measure yet.' : `${pct.toFixed(0)}% of the cap used. At 80% an alert goes out; at 100% the AI roles stop, the AI forecasters last.`)),
      B.note ? el('p', {class: 'small', style: 'margin:8px 0 0'}, c.icon('info'), ' ', B.note) : null,
      howto(c, 'The budget is counted in minutes of AI sessions, not money. The AI books and roles may use at most half of all measured minutes.')),
    sec(c, 'Minutes by kind of work', B.groups.length ? el('div', {class: 'md-table-wrap'}, el('table', {class: 'md-table'},
      el('thead', {}, el('tr', {}, ...['Kind of work', 'Minutes', 'Runs'].map(h => el('th', {scope: 'col'}, h)))),
      el('tbody', {}, ...B.groups.map(r => el('tr', {}, el('td', {}, GROUP[r.group]), el('td', {class: 'md-numeric'}, mins(r.minutes)), el('td', {class: 'md-numeric'}, String(r.runs)))))))
      : el('p', {class: 'empty muted'}, 'No minutes recorded this month.'),
      howto(c, 'Building the tool counts in the basis, not against the cap.'))));
}
/* Mount last: every function and state the render uses is defined by now (files 1-2). */
PF.mount({screen: 'budget', group: 'control', strip: false, dataLabel: 'Mock examples from the F&O data catalog (contract 2.8.0)',
  readHash(h) { KEY = h.get('s') in D.states ? h.get('s') : null; PF.st.wlOff = h.get('wloff') !== '0'; },
  writeHash(h) { if (KEY) h.set('s', KEY); if (!PF.st.wlOff) h.set('wloff', '0'); },
  render(main, c) {
    if (!c.P.fno) { location.replace('../31-dashboard/page.html#m=' + c.m); return; }   /* India only: absent in the US */
    topPart(main, c, 'AI usage and budget', 'AI usage and budget', 'How much AI time the desk used this month against its cap. Every AI role must earn its cost on the record.', false);
    budgetPart(main, c);
    main.append(srcLine(c, 'getFnoBudget', 'Every number is made up.'));
  }});
