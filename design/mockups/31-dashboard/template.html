<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omenix · Home</title>
<meta name="description" content="Omenix home after login: today at a glance, the market, today's buy picks of the strategies with one-click paper orders, how each strategy family and your own paper account are doing, open paper trades by who opened them, what needs you, what is coming and the news. The stock tool's own example records; research and paper trading only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* 31-dashboard page layout only; every component is from design/system/components.css. Tokens only. */
.sec{margin-top:20px}
.sec-head{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font:600 17px/1.3 var(--md-ref-typeface-plain);margin:0}
.sec-head .sub{font-size:12.5px;color:var(--md-sys-color-on-surface-variant);flex:1 1 240px}
.sec-head .go{margin-left:auto;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:2px;text-decoration:none;white-space:nowrap}
.sec-head .go .ms{width:16px;height:16px}
.top{padding-top:16px}
.aps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.home-sig{display:none;padding:0;overflow:hidden}
.pos{list-style:none;margin:0;padding:0}
.pos li{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 2px;border-top:1px solid var(--md-sys-color-surface-container-high)}
.pos li:first-child{border-top:0}
.pos .w{min-width:0} .pos .w .nm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pos .w small,.pos .q small,.pos .p small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.pos .q,.pos .p{font-variant-numeric:tabular-nums;text-align:right}
.pos .a{display:flex;gap:4px;justify-content:flex-end}
.tabs{margin-bottom:8px;flex-wrap:wrap;max-width:100%}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:6px;font-size:12.5px;color:var(--md-sys-color-on-surface-variant)}
.pager span{margin-right:auto}
.att{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.att li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px}
.att li b{display:block;font-weight:600} .att li small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:12.5px;overflow-wrap:anywhere}
.ev{list-style:none;margin:0;padding:0}
.ev li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}
.ev li:first-child{border-top:0}
.ev .d{text-align:center;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low);padding:4px 0;line-height:1.15}
.ev .d b{display:block;font-size:17px} .ev .d small{font-size:11px;color:var(--md-sys-color-on-surface-variant);text-transform:uppercase;letter-spacing:.05em}
.ev small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:12.5px}
.news{list-style:none;margin:0;padding:0}
.news li{padding:10px 0;border-top:1px solid var(--md-sys-color-surface-container-high);display:grid;gap:4px}
.news li:first-child{border-top:0}
.news .m{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.mv{display:flex;flex-wrap:wrap;gap:4px 12px}
@media (max-width:1199px){.home-sig{display:block}}
@media (max-width:760px){.pos li{grid-template-columns:minmax(0,1fr) auto}.pos .q{display:none}.pos .a{grid-column:1/-1;justify-content:flex-start}}
@media (max-width:599px){.top{padding-top:12px}.ev li{grid-template-columns:44px minmax(0,1fr)}.ev li .mb-label{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<!--@@ICONS@@-->
<script>const SHELL = /*__SHELL__*/null; const D = /*__DATA__*/null;</script>
<!--@@PLATFORM_JS@@-->
<script>
let OWNER = 'all', PPG = 0;  /* positions tab and page, kept in the URL as "own" and "ppg" */
const PPG_SIZE = 6;
PF.mount({screen: 'dashboard', group: 'dashboard', strip: false,
  readHash(h) { OWNER = ['manual', 'rule', 'ai', 'hybrid', 'baseline'].includes(h.get('own')) ? h.get('own') : 'all'; PPG = Math.max(0, (+h.get('ppg') || 1) - 1); },
  writeHash(h) { if (OWNER !== 'all') h.set('own', OWNER); if (PPG) h.set('ppg', PPG + 1); },
  render(main, c) {
  const {el, icon, inst, money, num, delta, moneyDelta, item, P, S} = c;
  const M = D.markets[c.m], FAM = S.families, TXT = S.family_text, session = M.session.date;
  const head = (title, sub, go) => el('div', {class: 'sec-head'}, el('h2', {}, title), sub ? el('span', {class: 'sub'}, sub) : null, go ? el('a', {class: 'go', href: '#', onclick: e => { e.preventDefault(); c.go(go[1]); }}, go[0], icon('chevron_right')) : null);
  main.append(el('h1', {class: 'vh'}, 'Home'));

  /* 1. today at a glance: how am I doing, what is the best pick, what needs me (each one click from acting) */
  const mine = M.groups.find(g => g.family === 'manual').lines[0];
  const best = P.signals[0], bi = best && item(best.id);
  main.append(el('div', {class: 'mb-glance top', role: 'region', 'aria-label': 'Today at a glance'},
    el('div', {}, el('span', {class: 'mb-avatar paper'}, icon('account_circle')), el('span', {class: 'l'}, 'Your paper account · open profit'),
      el('span', {class: 'v'}, moneyDelta(mine.pnl, 2), el('span', {class: 'muted', style: 'font-size:13px;font-weight:500'}, 'value ' + money(mine.value)))),
    best ? el('div', {}, el('span', {class: 'mb-avatar ' + (best.exp_gain_pct > 0 ? 'success' : 'danger')}, icon('bolt')), el('span', {class: 'l'}, `Top pick · ${best.agree.buy} of ${best.agree.of} strategies buy`),
      el('span', {class: 'v'}, inst(best.id), el('span', {class: 'mb-label ' + (best.exp_gain_pct > 0 ? 'success' : 'danger')}, icon(best.exp_gain_pct > 0 ? 'check' : 'close'), best.exp_gain_pct > 0 ? `Yes: ${c.sgn(best.exp_gain_pct)} after costs` : `No: ${c.sgn(best.exp_gain_pct)} after costs`), el('button', {class: 'md-btn small buy', type: 'button', disabled: !!c.tradeLock(), 'data-tip': c.tradeLock(), onclick: () => c.openOrder(best.id, 'buy')}, 'Buy')))
      : el('div', {}, el('span', {class: 'mb-avatar neutral'}, icon('bolt')), el('span', {class: 'l'}, 'Top pick'), el('span', {class: 'v'}, 'No pick today')),
    el('div', {}, el('span', {class: 'mb-avatar warn'}, icon('notifications_active')), el('span', {class: 'l'}, 'Needs you'),
      el('span', {class: 'v'}, `${M.attention.length} item${M.attention.length === 1 ? '' : 's'}`, el('a', {class: 'md-btn small outlined', href: '#needs', onclick: e => { e.preventDefault(); document.getElementById('needs').scrollIntoView({behavior: 'smooth'}); }}, 'See')))));

  /* 2. the market, on top (the top bar's index strip is not repeated on this page) */
  const spark = it => { const v = it.spark; if (!v) return null; const lo = Math.min(...v), hi = Math.max(...v); const s = c.svgEl('svg', {viewBox: '0 0 120 26', preserveAspectRatio: 'none', 'aria-hidden': 'true'}); s.append(c.svgEl('polyline', {points: v.map((y, i) => `${(i / (v.length - 1) * 120).toFixed(1)},${(23 - (y - lo) / (hi - lo || 1) * 20).toFixed(1)}`).join(' '), fill: 'none', stroke: v[v.length - 1] >= v[0] ? 'var(--mb-color-up)' : 'var(--mb-color-down)', 'stroke-width': '1.8', 'vector-effect': 'non-scaling-stroke'})); return s; };
  const stocks = Object.values(P.items).filter(i => i.kind === 'stock' && i.state === 'active').sort((x, y) => y.chg_pct - x.chg_pct);
  const regime = {EVENT_HEAVY: 'Event-heavy session', TRENDING: 'Trending market', CALM: 'Calm market'}[M.session.regime] || M.session.regime;
  const idx = P.indices.map(id => item(id));
  main.append(el('section', {class: 'sec', 'aria-label': 'Market'}, head('Market', (k => `${P.exchange} · ${regime} · ${k.open ? `open, ${k.text}; prices are the last close until the next price check` : `closed, ${k.text}; today’s close arrives with the ${c.when(M.session.post_close_at)} run`}`)(c.market()), ['Markets', 'markets']),
    el('div', {class: 'mb-mband'},
      ...idx.map(it => el('a', {href: '#', style: 'text-decoration:none;color:inherit', 'data-tip': c.asOf(it).tip, onclick: e => { e.preventDefault(); c.openDrawer('quick:' + it.id); }},
        el('div', {class: 'n'}, it.sym), el('div', {class: 'v'}, num(it.last), ' ', delta(it.chg_pct)), el('small', {class: 'muted'}, `5 days ${c.sgn(it.chg_5d_pct)} · ${c.asOf(it).short}`))),
      el('div', {class: 'brd'}, el('div', {class: 'n'}, 'The stock tool’s companies'),
        el('span', {class: 'mv'}, ...stocks.map(s => el('span', {}, inst(s.id), ' ', delta(s.chg_pct)))),
        el('span', {}, `${stocks.filter(s => s.chg_pct > 0).length} of ${stocks.length} tracked companies rose on the last close`)))));

  /* 3. today's buy picks: in the left panel on wide screens; here on tablets and phones (never both at once) */
  main.append(el('section', {class: 'sec card home-sig', 'aria-label': 'Today’s buy picks'}, ...c.signalsBody('home')));

  /* 4. who trades and how it is going: your account, each strategy family, the F&O books; never summed */
  main.append(el('section', {class: 'sec', 'aria-label': 'Who trades'}, head('Who trades, and how it is going', 'You, and each approach: rule-based, AI-based' + (P.fno ? ', hybrid (rule + AI)' : '') + ', with the baselines as the comparison line. Each line is its own paper account or scoreboard; nothing is added together.', ['Accounts and funds', 'funds']),
    el('div', {class: 'aps'}, ...M.groups.map(g => el('article', {class: 'mb-apcard'},
      el('div', {class: 'h'}, el('span', {class: 'mb-avatar ' + ({manual: 'paper', ai: 'info', rule: '', baseline: 'neutral', hybrid: 'warn'}[g.family])}, icon(FAM[g.family].icon)), el('b', {}, FAM[g.family].label), el('small', {}, TXT[g.family])),
      ...g.lines.map(l => el('div', {class: 'line'}, el('span', {class: 'k'}, l.label), el('div', {class: 'fig'}, l.value != null ? el('span', {class: 'val'}, money(l.value)) : null, el('span', {class: 'd'}, moneyDelta(l.pnl, 2), ' ' + l.pnl_label)), el('span', {class: 's'}, l.sub))),
      g.note ? el('div', {class: 'today'}, icon('info'), g.note) : null)))));

  /* 5. open paper trades by who opened them, paged; and what needs you */
  /* strategies' open trades grouped per stock and family (each strategy is its own experiment: P&L shown per trade, never summed) */
  const grouped = {};
  for (const t of M.strategy_trades) (grouped[t.id + '|' + t.family] ||= {id: t.id, family: t.family, trades: []}).trades.push(t);
  const all = M.own.map(p => ({...p, own: true})).concat(Object.values(grouped));
  const count = k => all.filter(p => k === 'all' || p.family === k).length;
  const tabs = el('div', {class: 'md-segmented dense tabs', role: 'group', 'aria-label': 'Who opened the trade'}, ...[['all', 'All'], ['manual', 'Yours'], ['rule', 'Rule-based'], ['ai', 'AI-based'], ...(P.fno ? [['hybrid', 'Hybrid']] : []), ['baseline', 'Baselines']].map(([k, v]) => el('button', {type: 'button', 'aria-pressed': String(OWNER === k), onclick: () => { OWNER = k; PPG = 0; c.rerender(); }}, `${v} ${count(k)}`)));
  const rows = all.filter(p => OWNER === 'all' || p.family === OWNER), pages = Math.max(1, Math.ceil(rows.length / PPG_SIZE)); PPG = Math.min(PPG, pages - 1);
  const uniq = xs => [...new Set(xs)];
  const posRow = p => { const it = item(p.id);
    if (p.own) return el('li', {}, el('div', {class: 'w'}, el('div', {class: 'nm'}, inst(p.id), c.apBadge('manual')), el('small', {}, `${p.strategy} · ${p.source}`)),
      el('div', {class: 'q'}, el('span', {}, `${num(p.qty, 0)} × ${num(p.avg)}`), el('small', {}, 'last ' + num(it.last) + ' · ' + c.asOf(it).short)),
      el('div', {class: 'p'}, moneyDelta(p.unrealised, 2), el('small', {}, c.sgn(p.unrealised / (p.avg * p.qty) * 100))),
      el('div', {class: 'a'}, c.bsPair(p.id)));
    const T = p.trades, pnl = uniq(T.map(t => t.unrealised)), exits = uniq(T.map(t => t.exit)).sort();
    return el('li', {}, el('div', {class: 'w'}, el('div', {class: 'nm'}, inst(p.id), c.apBadge(p.family)),
        el('small', {}, `${T.length} trade${T.length > 1 ? 's' : ''}: ${uniq(T.map(t => t.strategy)).join(', ')} · N+${uniq(T.map(t => t.horizon)).join(', N+')}`)),
      el('div', {class: 'q'}, el('span', {}, `${money(T[0].amount)} each`), el('small', {}, 'exits ' + exits.map(d => c.dateShort(d + 'T06:00:00Z') + (d === session ? ' (today)' : '')).join(', '))),
      el('div', {class: 'p'}, pnl.length === 1 ? moneyDelta(pnl[0], 2) : el('span', {}, moneyDelta(Math.min(...pnl), 2), ' to ', moneyDelta(Math.max(...pnl), 2)), el('small', {}, T.length > 1 ? 'each trade' : c.sgn(T[0].unrealised / T[0].amount * 100))),
      el('div', {class: 'a'}, c.bsPair(p.id))); };
  main.append(el('div', {class: 'grid sec'},
    el('section', {class: 'card', 'aria-label': 'Open paper trades'}, head('Open paper trades', 'Yours first, then each strategy family’s trades by stock. B and S trade your own account.', ['Portfolio', 'positions']), tabs,
      el('ul', {class: 'pos'}, ...rows.slice(PPG * PPG_SIZE, PPG * PPG_SIZE + PPG_SIZE).map(posRow), rows.length ? null : el('li', {class: 'quiet'}, 'Nothing open here.')),
      el('div', {class: 'pager'}, el('span', {}, rows.length ? `${PPG * PPG_SIZE + 1}–${Math.min(rows.length, PPG * PPG_SIZE + PPG_SIZE)} of ${rows.length}` : ''),
        el('button', {class: 'md-icon-btn small', type: 'button', 'aria-label': 'Previous page', disabled: PPG === 0, onclick: () => { PPG--; c.rerender(); }}, icon('chevron_left')),
        el('button', {class: 'md-icon-btn small', type: 'button', 'aria-label': 'Next page', disabled: PPG >= pages - 1, onclick: () => { PPG++; c.rerender(); }}, icon('chevron_right')))),
    el('section', {class: 'card', id: 'needs', 'aria-label': 'Needs you'}, head('Needs you', 'Things to look at today.'),
      el('ul', {class: 'att'}, ...M.attention.map(a => el('li', {}, el('span', {class: 'mb-avatar sm ' + a.tone}, icon(a.icon)), el('span', {}, el('b', {}, a.title), el('small', {}, a.sub))))))));

  /* 6. what is coming and what is said */
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const KIND = {rbi_policy: 'Policy', earnings: 'Results', holiday: 'Holiday', fno_expiry: 'F&O expiry', fomc: 'Fed', jobs_report: 'Jobs data', cpi: 'Inflation'};
  const STATUS = {confirmed_primary: 'confirmed', corroborated: 'corroborated', single_source: 'single source', unverified: 'unverified', rumour: 'rumour', promotional: 'promotional', contradicted: 'contradicted', not_checked: 'not checked yet'};
  main.append(el('div', {class: 'grid even sec'},
    el('section', {class: 'card'}, head('Coming up', 'Results, policy, holidays and expiry from the stock tool’s event calendar.', ['Calendar', 'events']),
      el('ul', {class: 'ev'}, ...M.events.map(e => { const d = new Date(e.date + 'T00:00:00Z'); return el('li', {}, el('span', {class: 'd'}, el('b', {}, d.getUTCDate()), el('small', {}, MON[d.getUTCMonth()])), el('span', {}, el('b', {}, e.inst ? inst(e.inst, e.title) : e.title), el('small', {}, c.dateShort(e.date + 'T06:00:00Z') + (e.date === session ? ' · today' : '') + (e.major ? ' · major' : ''))), el('span', {class: 'mb-label neutral'}, KIND[e.kind] || e.kind)); }))),
    el('section', {class: 'card'}, head('Top news', 'From the news run, with how far each story is confirmed.', ['News', 'news']),
      el('ul', {class: 'news'}, ...M.news.map(n => el('li', {}, el('b', {}, n.title), el('span', {class: 'm'}, ...n.tickers.map(t => P.items[t] ? inst(t) : el('span', {}, t)), el('span', {class: 'md-badge ' + n.status}, STATUS[n.status] || n.status), `${n.src} · ${c.when(n.at)}`)))))));
}});
</script>
</body>
</html>
