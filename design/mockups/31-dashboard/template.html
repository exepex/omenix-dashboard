<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omenix · Dashboard</title>
<meta name="description" content="Omenix home after login: quick search to trade any stock or F&O contract, your paper accounts, top stock and F&O ideas with quick paper orders, open positions, what needs attention, today's decisions, the market, events and news. Mock data, research and paper trading only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* 31-dashboard page layout only; every component is from design/system/components.css. Tokens only. */
.sec{margin-top:24px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font:600 17px/1.3 var(--md-ref-typeface-plain);margin:0}
.sec-head .end{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--md-sys-color-on-surface-variant);flex-wrap:wrap}
.sec-head .go{font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:2px;text-decoration:none}
.sec-head .go .ms{width:16px;height:16px}
.accts.mb-carousel{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));grid-auto-columns:auto;gap:12px;overflow:visible;padding-bottom:2px}
.sess{white-space:normal;height:auto;min-height:30px;padding-top:4px;padding-bottom:4px}
.hello{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:20px 0 14px}
.hello h1{font:700 24px/1.2 var(--md-ref-typeface-plain);letter-spacing:-.4px;margin:0}
.hello .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mb-color-neutral)} .dot.open{background:var(--mb-color-up)}
.pos{list-style:none;margin:0;padding:0}
.pos li{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.2fr) auto;gap:4px 16px;align-items:center;padding:12px 4px;border-top:1px solid var(--md-sys-color-surface-container-high)}
.pos li:first-child{border-top:0}
.pos .w b{display:block} .pos .w small,.pos .q small,.pos .p small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.pos .q,.pos .p{font-variant-numeric:tabular-nums;text-align:right}
.pos .p .mb-delta{font-size:14px}
.pos .a{display:flex;gap:4px;justify-content:flex-end}
.pos .flag{grid-column:1/-1;font-size:12.5px;color:var(--mb-color-on-warn-container);display:flex;gap:6px;align-items:center}
.pos .flag .ms{width:15px;height:15px}
.att{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.att li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px}
.att li b{display:block;font-weight:600} .att li small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:12.5px}
.risk{display:grid;gap:10px}
.risk .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.risk .r .md-progress{grid-column:1/-1}
.dec{list-style:none;margin:0;padding:0}
.dec li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}
.dec li:first-child{border-top:0}
.dec b{display:block;font-weight:600} .dec small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:12.5px}
.idx{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}
.idx:first-child{border-top:0}
.idx b{display:block} .idx small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:12px}
.idx svg{width:90px;height:28px;display:block}
.idx .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.movers .mb-micro{margin-bottom:4px}
.movers div.m{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
.breadth{margin-top:14px;font-size:12.5px;color:var(--md-sys-color-on-surface-variant)}
.breadth .bar{display:flex;height:8px;border-radius:2px;overflow:hidden;margin:6px 0}
.breadth .bar i{display:block} .breadth .bar .a{background:var(--mb-color-up)} .breadth .bar .d{background:var(--mb-color-down)} .breadth .bar .u{background:var(--md-sys-color-surface-container-highest)}
.ev{list-style:none;margin:0;padding:0}
.ev li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}
.ev li:first-child{border-top:0}
.ev .d{text-align:center;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low);padding:4px 0;line-height:1.15}
.ev .d b{display:block;font-size:17px} .ev .d small{font-size:11px;color:var(--md-sys-color-on-surface-variant);text-transform:uppercase;letter-spacing:.05em}
.ev small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:12.5px}
.news{list-style:none;margin:0;padding:0}
.news li{padding:10px 0;border-top:1px solid var(--md-sys-color-surface-container-high);display:grid;gap:4px}
.news li:first-child{border-top:0}
.news .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.proof{font-size:12px;color:var(--md-sys-color-on-surface-variant);display:flex;align-items:center;gap:6px}
.proof .ms{width:14px;height:14px}
@media (max-width:1000px){.pos li{grid-template-columns:minmax(0,1fr) auto}.pos .q{display:none}.pos .a{grid-column:1/-1;justify-content:flex-start}}
@media (max-width:599px){
  .hello{padding-top:14px}.hello h1{font-size:21px}
  .accts.mb-carousel{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:62%;overflow-x:auto;padding-bottom:8px}
  .movers{grid-template-columns:1fr}
}
</style>
</head>
<body>
<!--@@ICONS@@-->
<script>const SHELL = /*__SHELL__*/null; const D = /*__DATA__*/null;</script>
<!--@@PLATFORM_JS@@-->
<script>
PF.mount({screen: 'dashboard', group: 'dashboard', render(main, c) {
  const {el, icon, inst, money, num, delta, moneyDelta, item, P} = c;
  const M = D.markets[c.m], india = P.fno, acctName = id => (P.accounts[id] || {}).name || id;
  /* the multi-leg F&O ideas are paper baskets for the order window */
  for (const k of Object.keys(c.baskets)) delete c.baskets[k];
  for (const f of M.fno_ideas.filter(f => f.basket)) c.baskets[f.basket] = f;
  const head = (title, ...end) => el('div', {class: 'sec-head'}, el('h2', {}, title), el('span', {class: 'end'}, ...end));
  const goLink = (label, screen) => el('a', {class: 'go', href: '#', onclick: e => { e.preventDefault(); c.go(screen); }}, label, icon('chevron_right'));
  const proof = () => el('span', {class: 'proof', 'data-tip': `Not proven yet: ${D.proof.settled_trades} of about ${D.proof.needed} settled paper trades and ${D.proof.months_forward} of ${D.proof.months_needed} months of forward trading. Until then no signal is shown as strong.`}, icon('science'), `Not proven yet · ${D.proof.settled_trades} of ~${D.proof.needed} trades`);
  const carousel = (id, cards, cls = '') => { const row = el('div', {class: 'mb-carousel ' + cls, id, role: 'list'}, ...cards.map(x => { x.setAttribute('role', 'listitem'); return x; }));
    const nav = d => el('button', {class: 'md-icon-btn small outlined', type: 'button', 'aria-label': d < 0 ? 'Previous' : 'Next', onclick: () => row.scrollBy({left: d * (row.firstElementChild.offsetWidth + 16), behavior: 'smooth'})}, icon(d < 0 ? 'chevron_left' : 'chevron_right'));
    return [row, nav(-1), nav(1)]; };

  /* 1. hello: where am I (no banner: the session and freshness as chips) */
  main.append(el('div', {class: 'hello'}, el('h1', {}, 'Dashboard'),
    el('div', {class: 'meta'}, el('span', {class: 'md-chip sess'}, el('span', {class: 'dot' + (M.session.state === 'open' ? ' open' : '')}), M.session.text),
      el('span', {class: 'mb-asof', 'data-tip': 'Each section shows its own as-of time: the stock tool runs several times a day, the F&O tool after its 3 pm run.'}, icon('schedule'), 'Updated ' + c.nowLabel()), c.paperTag(), c.mockTag())));

  /* 2. quick search: find and trade */
  main.append(c.quickSearch());

  /* 3. my paper accounts (one tile each, never summed) */
  main.append(el('section', {class: 'sec', 'aria-label': 'Your paper accounts'}, head('Your paper accounts', el('span', {'data-tip': 'Each paper account is its own experiment: never added together, and INR and USD are never mixed.'}, 'Separate accounts, never summed'), goLink('Accounts and funds', 'funds')),
    el('div', {class: 'accts mb-carousel'}, ...M.accounts.map(a => el('a', {class: 'mb-acct ' + (a.kind === 'book' ? 'book' : a.kind === 'stock' ? 'stock' : ''), href: '#', onclick: e => { e.preventDefault(); c.go('funds'); }},
      el('span', {class: 'n'}, a.name), el('span', {class: 'v'}, money(a.value)),
      el('span', {class: 'd'}, moneyDelta(a.day), 'today'), el('span', {class: 'd'}, `${a.note} · cash ${money(a.cash)}`))))));

  /* 4. top ideas: stocks (and F&O, India only), each with a quick paper order */
  const stockCard = s => { const it = item(s.id);
    return el('article', {class: 'mb-idea'},
      el('div', {class: 'mb-idea-top'}, el('span', {class: 'mb-score', style: `--v:${s.score}`, 'data-tip': D.score_note, role: 'img', 'aria-label': `Score ${s.score} of 100`}, el('b', {}, s.score)),
        el('div', {class: 'who'}, el('b', {}, inst(s.id)), el('small', {}, it.name))),
      el('div', {class: 'mb-idea-px'}, c.num(it.last), delta(it.chg_pct), c.asOfEl(it)),
      el('div', {class: 'mb-idea-why'}, el('span', {class: 'mb-label success', style: 'margin-right:6px'}, icon('check'), 'Buy signal'), s.why),
      el('dl', {class: 'mb-idea-facts'},
        el('div', {}, el('dt', {}, 'Chance up · N+' + s.horizon), el('dd', {}, Math.round(s.prob * 100) + '%')),
        el('div', {}, el('dt', {}, 'Target'), el('dd', {}, num(s.target, 0) + ' ', el('span', {class: 'mb-delta up'}, '+' + s.exp_pct.toFixed(1) + '%'))),
        el('div', {}, el('dt', {}, 'Range 80%'), el('dd', {}, `${num(s.range[0], 0)}–${num(s.range[1], 0)}`))),
      el('div', {class: 'mb-idea-acts'}, el('button', {class: 'md-btn filled buy', type: 'button', onclick: () => c.openOrder(s.id, 'buy')}, 'Paper buy'),
        el('button', {class: 'md-btn outlined', type: 'button', onclick: () => c.openDrawer('quick:' + s.id)}, 'Details')),
      el('div', {class: 'muted', style: 'font-size:12px'}, `${s.agree[0]} of ${s.agree[1]} strategies agree · target after market costs`)); };
  const [sRow, sPrev, sNext] = carousel('ideas-stocks', M.stock_ideas.map(stockCard));
  main.append(el('section', {class: 'sec', 'aria-label': 'Top stock ideas'}, head('Top stock ideas', proof(), sPrev, sNext, goLink('Screener', 'screener')), sRow));
  if (india && M.fno_ideas.length) {
    const fnoCard = f => f.verdict === 'no'
      ? el('article', {class: 'mb-idea no'}, el('div', {class: 'mb-idea-top'}, el('span', {class: 'mb-avatar danger'}, icon('block')), el('div', {class: 'who'}, el('b', {}, f.name), el('small', {}, f.source))),
          el('div', {class: 'mb-idea-why'}, el('span', {class: 'mb-label danger', style: 'margin-right:6px'}, icon('close'), 'No trade'), f.why), el('div', {class: 'mb-idea-acts'}, el('button', {class: 'md-btn outlined', type: 'button', onclick: () => c.go('scoreboards')}, 'Why: decision record')))
      : el('article', {class: 'mb-idea'},
          el('div', {class: 'mb-idea-top'}, el('span', {class: 'mb-score', style: `--v:${f.score}`, 'data-tip': D.score_note, role: 'img', 'aria-label': `Score ${f.score} of 100`}, el('b', {}, f.score)), el('div', {class: 'who'}, el('b', {}, f.name), el('small', {}, f.source))),
          el('div', {class: 'mb-idea-why'}, el('span', {class: 'mb-label success', style: 'margin-right:6px'}, icon('check'), 'Trade'), f.why),
          el('dl', {class: 'mb-idea-facts'},
            el('div', {'data-tip': 'Risk-neutral: what option prices imply, not our forecast.'}, el('dt', {}, 'Profit chance'), el('dd', {}, f.pop + '% RN')),
            el('div', {}, el('dt', {}, f.kind === 'credit' ? 'Credit' : 'Cost'), el('dd', {}, money(f.kind === 'credit' ? f.credit : f.debit))),
            el('div', {}, el('dt', {}, 'Max loss'), el('dd', {}, money(f.max_loss)))),
          el('div', {class: 'mb-idea-acts'}, el('button', {class: 'md-btn filled buy', type: 'button', onclick: () => c.openDrawer('basket:' + f.basket)}, 'Paper basket'),
            el('button', {class: 'md-btn outlined', type: 'button', onclick: () => c.go('builder')}, 'Builder')),
          el('div', {class: 'muted', style: 'font-size:12px'}, `1 lot · ${f.legs.length} legs · 3 pm quotes · within your ₹10,000 loss limit`));
    const [fRow, fPrev, fNext] = carousel('ideas-fno', M.fno_ideas.map(fnoCard), 'two');
    main.append(el('section', {class: 'sec', 'aria-label': 'Top F&O ideas'}, head('Top F&O ideas', el('span', {'data-tip': 'Paper F&O orders fill only from the recorded NIFTY monthly 3 pm snapshot, so ideas are NIFTY monthly structures.'}, 'NIFTY monthly · 3 pm snapshot'), fPrev, fNext, goLink('Option chain', 'chain')), fRow));
  }

  /* 5. positions and what needs attention */
  const posRow = p => {
    if (p.structure) return el('li', {}, el('div', {class: 'w'}, el('b', {}, p.structure), el('small', {}, `${acctName(p.account)} · ${p.legs.length} legs · ${p.days_left} days left`)),
      el('div', {class: 'q'}, el('span', {}, 'max loss ' + money(p.max_loss)), el('small', {}, p.exit_rule)),
      el('div', {class: 'p'}, moneyDelta(p.unrealised), el('small', {}, moneyDelta(p.day), ' today')),
      el('div', {class: 'a'}, el('button', {class: 'md-btn outlined small', type: 'button', onclick: () => c.go('positions')}, 'Legs')));
    const it = item(p.id), cost = p.avg * p.qty;
    return el('li', {}, el('div', {class: 'w'}, el('b', {}, inst(p.id)), el('small', {}, `${acctName(p.account)}${p.exit ? ' · exits ' + p.exit : ''}`)),
      el('div', {class: 'q'}, el('span', {}, `${p.qty} × ${num(p.avg)}`), el('small', {}, 'last ' + num(it.last) + ' · ' + c.asOf(it).short)),
      el('div', {class: 'p'}, moneyDelta(p.unrealised), el('small', {}, c.sgn(p.unrealised / cost * 100) + ' · ', moneyDelta(p.day), ' today')),
      el('div', {class: 'a'}, c.bsPair(p.id)),
      p.flag ? el('div', {class: 'flag'}, icon('warning'), p.flag) : null); };
  const attention = el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'Needs attention'), el('span', {class: 'end'}, `${M.attention.length}`)),
    el('ul', {class: 'att'}, ...M.attention.map(a => el('li', {}, el('span', {class: 'mb-avatar sm ' + a.tone}, icon(a.icon)), el('span', {}, el('b', {}, a.title), el('small', {}, a.sub))))));
  const risk = india ? el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'At risk now'), c.help('The sum of the maximum losses of each account’s open F&O structures against its ₹30,000 limit. Per account, never added across accounts.'), el('span', {class: 'end'}, goLink('Risk', 'risk'))),
    el('div', {class: 'risk'}, ...M.at_risk.map(r => el('div', {class: 'r'}, el('span', {}, acctName(r.account)), el('b', {}, `${money(r.used)} / ${money(r.limit)}`), el('div', {class: 'md-progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': r.limit, 'aria-valuenow': r.used, 'aria-label': acctName(r.account) + ' at risk'}, el('i', {style: `width:${Math.max(1, r.used / r.limit * 100).toFixed(1)}%`})))))) : null;
  main.append(el('div', {class: 'grid sec'},
    el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'Open positions'), el('span', {class: 'end'}, `${M.positions.length} across ${new Set(M.positions.map(p => p.account)).size} accounts`, goLink('Portfolio', 'positions'))),
      el('ul', {class: 'pos'}, ...M.positions.map(posRow)),
      el('p', {class: 'note'}, 'Each position stays in its own paper account; nothing is summed. B and S trade your Manual account; strategy books are not traded by hand.')),
    el('div', {class: 'col'}, attention, risk)));

  /* 6. today's decisions and the market */
  const spark = it => { const v = it.spark || [], lo = Math.min(...v), hi = Math.max(...v); const s = c.svgEl('svg', {viewBox: '0 0 90 28', preserveAspectRatio: 'none', 'aria-hidden': 'true'}); s.append(c.svgEl('polyline', {points: v.map((y, i) => `${(i / (v.length - 1) * 90).toFixed(1)},${(25 - (y - lo) / (hi - lo || 1) * 22).toFixed(1)}`).join(' '), fill: 'none', stroke: it.chg_pct >= 0 ? 'var(--mb-color-up)' : 'var(--mb-color-down)', 'stroke-width': '1.8', 'vector-effect': 'non-scaling-stroke'})); return s; };
  const stocks = Object.values(P.items).filter(i => i.kind === 'stock').sort((a, b) => b.chg_pct - a.chg_pct);
  const b = M.breadth, tot = b.adv + b.dec + b.unch;
  const vmark = v => el('span', {class: 'mb-mark ' + (v === 'yes' ? 'ok' : v === 'no' ? 'no' : 'na')}, icon(v === 'yes' ? 'check' : v === 'no' ? 'close' : 'remove'));
  main.append(el('div', {class: 'grid even sec'},
    el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'Today’s decisions'), el('span', {class: 'end'}, goLink('Strategies', 'scoreboards'))),
      el('ul', {class: 'dec'}, ...M.decisions.map(d => el('li', {}, vmark(d.verdict), el('span', {}, el('b', {}, `${d.who}: ${d.what}`), el('small', {}, d.detail)), el('span', {class: 'mb-asof'}, c.when(d.at)))))),
    el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'Market'), el('span', {class: 'end'}, goLink('Markets', 'markets'))),
      el('div', {}, ...P.indices.map(id => { const it = item(id); return el('div', {class: 'idx'}, el('span', {}, el('b', {}, inst(id)), el('small', {}, c.asOf(it).short)), spark(it), el('span', {class: 'v'}, num(it.last), el('br'), delta(it.chg_pct))); })),
      el('div', {class: 'movers'}, el('div', {}, el('div', {class: 'mb-micro'}, 'Top gainers'), ...stocks.slice(0, 3).map(i => el('div', {class: 'm'}, inst(i.id), delta(i.chg_pct)))),
        el('div', {}, el('div', {class: 'mb-micro'}, 'Top losers'), ...stocks.slice(-3).reverse().map(i => el('div', {class: 'm'}, inst(i.id), delta(i.chg_pct))))),
      el('div', {class: 'breadth'}, el('div', {class: 'bar', role: 'img', 'aria-label': `${b.adv} advances, ${b.dec} declines, ${b.unch} unchanged`}, el('i', {class: 'a', style: `width:${b.adv / tot * 100}%`}), el('i', {class: 'u', style: `width:${b.unch / tot * 100}%`}), el('i', {class: 'd', style: `width:${b.dec / tot * 100}%`})),
        el('span', {}, `▲ ${b.adv.toLocaleString('en-IN')} advances · ▼ ${b.dec.toLocaleString('en-IN')} declines · ${b.unch} unchanged · ${b.source}`)))));

  /* 7. this week and news */
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  main.append(el('div', {class: 'grid even sec'},
    el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'Coming up'), el('span', {class: 'end'}, goLink('Calendar', 'events'))),
      el('ul', {class: 'ev'}, ...M.events.map(e => { const d = new Date(e.date + 'T00:00:00Z'); return el('li', {}, el('span', {class: 'd'}, el('b', {}, d.getUTCDate()), el('small', {}, MON[d.getUTCMonth()])), el('span', {}, el('b', {}, e.inst ? inst(e.inst, e.title) : e.title), el('small', {}, `${c.dateShort(e.date + 'T06:00:00Z')} · ${e.time}`)), el('span', {class: 'mb-label neutral'}, e.kind)); }))),
    el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'Top news'), el('span', {class: 'end'}, goLink('News', 'news'))),
      el('ul', {class: 'news'}, ...M.news.map(n => el('li', {}, el('b', {}, n.title), el('span', {class: 'm'}, inst(n.inst), el('span', {class: 'md-badge ' + n.status}, n.status.replace('_', ' ')), `${n.src} · ${c.when(n.at)}`)))))));
}});
</script>
</body>
</html>
