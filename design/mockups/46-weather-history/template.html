<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omenix · F&amp;O weather history</title>
<meta name="description" content="The market weather's history: every session's colour, whether it was made live or rebuilt from history, and the counts by colour. Every state is a Mock example from the F&amp;O data catalog. India, F&amp;O only. Research and paper only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* 46-weather-history page layout only; every component is from design/system/components.css. Tokens only. */
.lede{margin:4px 0 0;font-size:14px;max-width:820px}
.muted{color:var(--md-sys-color-on-surface-variant)} .small{font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.qpick{max-width:100%;flex-wrap:wrap}
.stack{display:grid;gap:16px;min-width:0;margin-top:16px}
.card.sec{padding:16px 18px;min-width:0}
.sec h2{font:600 16px/1.3 var(--md-ref-typeface-plain);margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h3{font:600 13.5px/1.3 var(--md-ref-typeface-plain);margin:12px 0 4px}
.facts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mix{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--md-sys-color-surface-container);margin-top:10px}
.mix i{display:block;height:100%}
.mix .g{background:var(--mb-color-up-container)} .mix .a{background:var(--mb-color-warn-container)} .mix .r{background:var(--mb-color-down-container)} .mix .n{background:var(--mb-color-neutral-container)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px;margin-top:6px}
.strip span{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low);font-size:11px;color:var(--md-sys-color-on-surface-variant);min-width:0}
.strip span .mb-label{padding:2px 4px}
.src{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.empty{font-size:13.5px;margin:0}
@media (max-width:599px){.facts4{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<!--@@ICONS@@-->

<script>
/* every state is a Mock example on 16 Nov 2026 at 15:30 IST, after the card was sent (the catalog's made-up date) */
(() => { SHELL.now = '2026-11-16T10:00:00Z';
  Object.assign(SHELL.markets.india.status, {open_utc: '2026-11-16T03:45:00Z', close_utc: '2026-11-16T10:00:00Z', next_open_utc: '2026-11-17T03:45:00Z', example_open_now: '2026-11-16T09:00:00Z'});
  Object.assign(SHELL.markets.us.status, {open_utc: '2026-11-16T14:30:00Z', close_utc: '2026-11-16T21:00:00Z', next_open_utc: '2026-11-16T14:30:00Z', example_open_now: '2026-11-16T15:00:00Z'}); })();
</script>
<!--@@PLATFORM_JS@@-->
<!--@@PAGE_JS@@-->
</body>
</html>
