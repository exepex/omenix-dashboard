<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omenix · Today's card</title>
<meta name="description" content="The daily trade card, PAPER ONLY: every NSE session day the F&O desk says TRADE, NO TRADE with its reason, or WATCH (a shadow, never traded), with how much it can lose, why, how sure, and what would prove it wrong. Every state is a Mock example from the F&O data catalog (story P1). India, F&O only. Research and paper only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* 39-trade-card page layout only; every component is from design/system/components.css. Tokens only. */
.lede{margin:4px 0 0;font-size:14px;max-width:820px}
.muted{color:var(--md-sys-color-on-surface-variant)} .small{font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.qpick{max-width:100%;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;margin-top:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.card.sec{padding:16px 18px}
.sec h2{font:600 16px/1.3 var(--md-ref-typeface-plain);margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.howto{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--md-sys-color-on-surface-variant);margin:8px 0 0}
.howto svg{width:16px;height:16px;flex:none;fill:currentColor;margin-top:1px}
.mb-verdict{margin-top:16px}
.mb-verdict.watch{background:var(--mb-color-info-container);color:var(--mb-color-on-info-container)}
.mb-verdict.watch .mb-verdict-box{background:var(--mb-color-info)}
.mb-verdict .why{font-size:15px;font-weight:600;margin:0}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.what{font:600 15px/1.4 var(--md-ref-typeface-plain);margin:0 0 10px}
.owner{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.owner svg{width:14px;height:14px;fill:currentColor}
.range{position:relative;height:34px;margin:6px 0 2px}
.range .track{position:absolute;left:0;right:0;top:12px;height:10px;border-radius:3px;background:var(--md-sys-color-surface-container)}
.range .ok{position:absolute;top:12px;height:10px;border-radius:3px;background:var(--mb-color-up)}
.range .stop{position:absolute;top:6px;width:2px;height:22px;background:var(--mb-color-down)}
.range-keys{display:flex;justify-content:space-between;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.cap{display:grid;gap:4px;margin-top:4px}
.cap .bar{position:relative;height:12px;border-radius:3px;background:var(--md-sys-color-surface-container)}
.cap .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--mb-color-down)}
.list{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13.5px}
.facts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chance{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center;margin:6px 0}
.chance .track{position:relative;height:14px;border-radius:3px;background:var(--md-sys-color-surface-container)}
.chance .track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--mb-chart-1)}
.chance b{text-align:right;font-variant-numeric:tabular-nums}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:6px 0}
.ladder span{display:grid;gap:2px;padding:6px;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low);font-size:11.5px;color:var(--md-sys-color-on-surface-variant);min-width:0;overflow-wrap:anywhere}
.ladder span b{font-size:13px;color:var(--md-sys-color-on-surface)}
.ladder span.on{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);outline:2px solid var(--md-sys-color-primary)}
.ladder span.on b{color:var(--md-sys-color-on-primary-container)}
.missing{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.missing li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13px}
.missing li small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:12px}
.hashes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hashes code{font-size:11.5px;padding:2px 6px;border-radius:3px;background:var(--md-sys-color-surface-container);overflow-wrap:anywhere}
.src{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.md-table td small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant);overflow-wrap:anywhere}
@media (max-width:1099px){.cols{grid-template-columns:1fr}}
@media (max-width:699px){.times{grid-template-columns:repeat(2,minmax(0,1fr))}.facts3{grid-template-columns:1fr 1fr}}
@media (max-width:599px){.mb-verdict .mb-verdict-word{font-size:36px}.ladder{grid-template-columns:repeat(3,minmax(0,1fr))}.md-table th,.md-table td{padding:8px 6px;white-space:normal}}
</style>
</head>
<body>
<!--@@ICONS@@-->

<!--@@PAGE_JS@@-->
</body>
</html>
