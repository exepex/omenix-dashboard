<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omenix · Stock page</title>
<meta name="description" content="Everything about one stock, from real records of 13 Oct 2026: price and its chart over 1 month to 2 years against the index, valuation and key figures in words, what our strategies, the model and the AI team think and the range they expect, the strategies' open paper trades, the news with how far each story is confirmed, results and filings, and, in India, its futures and options. Nothing is live. Research and paper trading only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* 35-stock page layout only; every component is from design/system/components.css. Tokens only. */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:end}
.price{font:700 30px/1.1 var(--md-ref-typeface-plain);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.price .mb-delta{font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tabs{margin:18px 0 12px;flex-wrap:wrap;max-width:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sec{margin-top:16px}
.sec-head{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font:600 16px/1.3 var(--md-ref-typeface-plain);margin:0}
.sec-head .sub{font-size:12.5px;color:var(--md-sys-color-on-surface-variant);flex:1 1 220px}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--md-sys-color-on-surface-variant);margin-top:4px;gap:8px}
.muted{color:var(--md-sys-color-on-surface-variant)} .small{font-size:12.5px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-top:1px solid var(--md-sys-color-surface-container-high);display:grid;gap:4px}
.list li:first-child{border-top:0}
.list li .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.scroll{overflow-x:auto}
.md-table td small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.ai p{margin:6px 0 0;font-size:13px} .ai b{font-weight:600}
@media (max-width:899px){table.stack thead{display:none}table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:auto}table.stack tr{padding:8px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}table.stack td{border:0;padding:2px 0;text-align:left}table.stack td[data-k]::before{content:attr(data-k) ": ";color:var(--md-sys-color-on-surface-variant);font-size:12px}}
.quick{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:13px;color:var(--md-sys-color-on-surface-variant)}
.quick svg{width:18px;height:18px;fill:currentColor}
.pchart{position:relative}
.pchart svg{touch-action:pan-y;cursor:crosshair;user-select:none}
.xtip{position:absolute;top:4px;left:8px;padding:4px 8px;border-radius:4px;background:var(--md-sys-color-inverse-surface);color:var(--md-sys-color-inverse-on-surface);font-size:12px;pointer-events:none;max-width:calc(100% - 16px)}
.xtip[hidden]{display:none}
.plot .fan80{fill:var(--mb-chart-1);opacity:.14}.plot .fan50{fill:var(--mb-chart-1);opacity:.28}
.plot .cross{stroke:var(--md-sys-color-outline);stroke-width:1}.plot .sel{fill:var(--mb-chart-1);opacity:.12}
.plot .entry{fill:var(--md-sys-color-surface);stroke:var(--mb-chart-4);stroke-width:2}
.axis .keys{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center}
.axis .keys i,.key{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.k1,.key.fut{background:var(--mb-chart-1)}.k2{background:var(--mb-chart-2)}.k3{background:var(--mb-chart-3)}.kf{background:var(--mb-chart-1);opacity:.35;height:8px!important}
.ke{width:8px!important;height:8px!important;border-radius:50%!important;border:2px solid var(--mb-chart-4);background:transparent}
.key.rev{background:var(--mb-chart-1);height:8px}.key.prof{background:var(--mb-chart-3);height:8px}.key.mline{background:var(--mb-chart-2)}.key.oi{background:var(--md-sys-color-outline-variant);height:8px}
.kn{margin-bottom:12px}.kn .k{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-bottom:4px}.kn small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:4px}
.kn.two{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
.dial{width:120px;height:68px;display:block}.dial path{fill:none;stroke-width:9}.dial .zone{stroke:var(--md-sys-color-surface-container-highest)}.dial .mid{stroke:var(--md-sys-color-surface-container)}
.dial .tick{stroke:var(--md-sys-color-outline);stroke-width:1.5}.dial .needle{stroke:var(--md-sys-color-on-surface);stroke-width:2.5;stroke-linecap:round}.dial .hub{fill:var(--md-sys-color-on-surface)}
.cmp{display:grid;gap:4px;font-size:12px}.vbar{display:grid;grid-template-columns:96px minmax(0,1fr) 48px;gap:6px;align-items:center}.vbar small{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .track,.hbar{position:relative;display:block;height:10px;border-radius:3px;background:var(--md-sys-color-surface-container)}.vbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--mb-chart-1)}.vbar b{font-size:12px;text-align:right}
.hbar{width:120px;flex:none}.hbar i{position:absolute;top:0;bottom:0;border-radius:3px}.hbar .pos{background:var(--mb-color-up)}.hbar .neg{background:var(--mb-color-down)}
.hbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--md-sys-color-outline)}
.pnl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}.pnl small{font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.fams{display:grid}.fam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--md-sys-color-surface-container-high)}
.fam.hd{border-top:0;padding:0 0 4px;font-size:12px;color:var(--md-sys-color-on-surface-variant)}.fam small{display:block;font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:2px}
.votes{display:grid;grid-template-columns:repeat(5,44px);gap:6px;text-align:center}.votes.none{display:block;text-align:right}
.vote small{font-size:11px;color:var(--md-sys-color-on-surface-variant)}.vote .stack{display:flex;flex-direction:column-reverse;gap:1px;height:36px;justify-content:flex-start;align-items:center}
.vote .stack i{display:block;width:22px;flex:1 1 0;max-height:12px;border-radius:2px;background:var(--md-sys-color-surface-container-high)}.vote .stack i.on{background:var(--mb-chart-1)}
.note{display:flex;gap:6px;align-items:center;margin:0 0 12px;color:var(--md-sys-color-on-surface-variant)}.note svg{width:18px;height:18px;fill:currentColor;flex:none}
.plot.bars{width:100%;height:auto;display:block}.plot .rev{fill:var(--mb-chart-1)}.plot .prof{fill:var(--mb-chart-3)}.plot .loss{fill:var(--mb-color-down)}
.plot .mline{fill:none;stroke:var(--mb-chart-2);stroke-width:2.5}.plot .mval{font:600 12px var(--md-ref-typeface-plain);fill:var(--md-sys-color-on-surface)}.plot .lbl{font:11px var(--md-ref-typeface-plain);fill:var(--md-sys-color-on-surface-variant)}
.plot .oi{fill:var(--md-sys-color-outline-variant)}.plot .futl{fill:none;stroke:var(--mb-chart-1);stroke-width:2}
@media (max-width:599px){.kn.two{grid-template-columns:1fr}.votes{grid-template-columns:repeat(5,34px);gap:4px}.fam{grid-template-columns:1fr}.hbar{width:90px}}
button[hidden]{display:none}
.mb-pos52.wide{display:grid;grid-template-columns:auto minmax(0,1fr) auto}.mb-pos52.wide .track{width:auto}
.acts .key,.small .key{margin-left:10px}
.src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 0}
@media (max-width:1100px){.grid2,.grid2.even{grid-template-columns:1fr}}
@media (max-width:599px){.md-table th,.md-table td{padding:8px 6px;white-space:normal}.head{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.price{font-size:26px}}
</style>
</head>
<body>
<!--@@ICONS@@-->
<script>const SHELL = /*__SHELL__*/null; const D = /*__DATA__*/null;</script>
<script>
/* this page reads the stock tool's records up to 13 Oct 2026 14:30 IST: India is open (the price is the 12 Oct close
   and the tool's last price check), the US is closed (its 12 Oct close) */
(() => { SHELL.now = D.clock;
  Object.assign(SHELL.markets.india.status, {open_utc: '2026-10-13T03:45:00Z', close_utc: '2026-10-13T10:00:00Z', next_open_utc: '2026-10-14T03:45:00Z', example_open_now: '2026-10-13T09:00:00Z'});
  Object.assign(SHELL.markets.us.status, {open_utc: '2026-10-13T13:30:00Z', close_utc: '2026-10-13T20:00:00Z', next_open_utc: '2026-10-13T13:30:00Z', example_open_now: '2026-10-13T15:00:00Z'});
  SHELL.sources.check = {label: 'Price check', detail: 'the stock tool’s intraday price check, not a live price', max_age_h: 6};
  Object.assign(SHELL.markets.india.next_quotes, {stock: "the stock tool's next price check (today)"});
  Object.assign(SHELL.markets.us.next_quotes, {stock: "the stock tool's next price check (13 Oct, after the 09:30 ET open)"});
  for (const [m, S] of Object.entries(D.markets)) { const q = S.quote, it = SHELL.markets[m].items[S.ticker] || {};
    SHELL.markets[m].items[S.ticker] = {...it, id: S.ticker, kind: 'stock', sym: S.ticker, code: S.ticker, name: `${S.name} · ${S.exchange}`, state: 'active', fno: !!S.fno,
      ...(q.check ? {last: q.check.price, chg_pct: q.check.chg_pct, source: 'check', as_of: q.check.at} : {last: q.close, chg_pct: q.chg_pct, source: 'close', as_of: q.date + (m === 'india' ? 'T10:00:00Z' : 'T20:00:00Z')})}; } })();
</script>
<!--@@PLATFORM_JS@@-->
<!--@@PAGE_JS@@-->
</body>
</html>
