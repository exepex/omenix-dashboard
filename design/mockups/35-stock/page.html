<script>
/* Omenix platform runtime, part 1 of 7 (files design/mockups/_platform/js/*.js, concatenated in file order by platform_build.py
   into one script). The runtime of the design mockups (design/PLATFORM_DESIGN.md sections 2, 3, 5 and 6).
   A page defines `const SHELL = ...30-shell/data.json...` and `const D = ...its own data.json...`, then this script,
   then calls PF.mount({screen, group, render(main, ctx)}). The shell draws the app bar (brand, global search, market
   switch, index strip, bell, theme, profile), the navigation rail (groups with flyouts, pinned screens), the
   picks panel (today’s buy picks by strategy family with their real figures; filter chips, pages, B / S on every row), the hover card, the context
   menu, the command palette, the shortcuts list, the right drawer (Paper order window, quick view; a bottom sheet on
   phones) and the phone bottom tabs. Every class is a component of design/system/components.css; this file holds
   behaviour only. The URL hash holds the state (m, theme, wl, density, rail, drawer, pal, keys, hc, menu, fly, notif,
   wlopen, ap, pg, fno), so Back, Forward and bookmarks work and every screenshot state is a link. Paper only: the order window
   records a paper order in the dashboard's inbox; nothing here places, modifies or cancels a real order. */
'use strict';
const PF = (() => {
const S = SHELL;
const NOW = Date.parse(S.now);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); } return n; };
const svgEl = (tag, attrs = {}) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
/** The logo tile (design/brand/): the sprite's mb-logo mark on the brand gradient. */
const brandMark = () => { const s = svgEl('svg', {class: 'mb-logo', 'aria-hidden': 'true'}); const u = svgEl('use'); u.setAttribute('href', '#mb-logo'); s.append(u); const t = document.createElement('span'); t.className = 'mb-brand-mark'; t.append(s); return t; };
const icon = (id, cls = 'ms') => { const s = svgEl('svg', {class: cls, 'aria-hidden': 'true'}); const u = svgEl('use'); u.setAttribute('href', '#ms-' + id); s.append(u); return s; };
const help = tip => el('button', {class: 'md-help', type: 'button', 'data-tip': tip, 'aria-label': 'Explain'}, '?');

/* ---- state and the URL ------------------------------------------------------------------------------------- */
const st = {clock: 'now', m: 'india', theme: 'light', wl: 0, ap: 'all', pg: 0, fno: 'today', density: 'comfortable', rail: 'labels', wlOff: false, drawer: null, pal: null, keys: false, hc: null, menu: null, fly: null, notif: false, wlopen: false};
let page = null, lastFocus = null;
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('m') in S.markets) st.m = h.get('m');
  st.clock = h.get('clock') === 'open' ? 'open' : 'now';
  if (['light', 'dark', 'system'].includes(h.get('theme'))) st.theme = h.get('theme');
  if (['rule', 'ai', 'hybrid'].includes(h.get('ap'))) st.ap = h.get('ap');
  st.pg = Math.max(0, (+h.get('pg') || 1) - 1); st.fno = h.get('fno') === 'example' ? 'example' : 'today';
  if (h.get('density') === 'compact') st.density = 'compact';
  if (h.get('rail') === 'icons') st.rail = 'icons';
  if (h.get('wloff') === '1') st.wlOff = true;
  st.drawer = h.get('drawer'); st.pal = h.get('pal'); st.keys = h.get('keys') === '1'; st.hc = h.get('hc'); st.menu = h.get('menu');
  st.fly = h.get('fly'); st.notif = h.get('notif') === '1'; st.wlopen = h.get('wlopen') === '1';
  if (page && page.readHash) page.readHash(h);
}
function writeHash() {
  const h = new URLSearchParams();
  if (st.m !== 'india') h.set('m', st.m);
  if (st.clock === 'open') h.set('clock', 'open');
  if (st.theme !== 'light') h.set('theme', st.theme);
  if (st.ap !== 'all') h.set('ap', st.ap);
  if (st.pg) h.set('pg', st.pg + 1);
  if (st.fno !== 'today') h.set('fno', st.fno);
  if (st.density !== 'comfortable') h.set('density', st.density);
  if (st.rail !== 'labels') h.set('rail', st.rail);
  if (st.wlOff) h.set('wloff', '1');
  if (st.drawer) h.set('drawer', st.drawer);
  if (page && page.writeHash) page.writeHash(h);
  const s = h.toString();
  history.replaceState(null, '', s ? '#' + s : location.pathname + location.search);
}

/* ---- formatting --------------------------------------------------------------------------------------------- */
const LOC = {INR: 'en-IN', USD: 'en-US'}, SYM = {INR: '₹', USD: '$'};
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const P = (m = st.m) => S.markets[m];
const cur = () => P().currency;
const num = (x, d = 2, c = cur()) => x == null ? '—' : Math.abs(x).toLocaleString(LOC[c], {minimumFractionDigits: d, maximumFractionDigits: d});
const money = (x, d = null, sign = false, c = cur()) => { if (x == null) return '—'; const dd = d == null ? (c === 'INR' ? 0 : 2) : d; return (x < 0 ? '−' : sign && x > 0 ? '+' : '') + SYM[c] + num(x, dd, c); };
const sgn = (x, d = 2, u = '%') => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d) + u;
const dir = x => x > 0 ? 'up' : x < 0 ? 'down' : 'flat';
const delta = (x, d = 2, u = '%') => x == null ? el('span', {class: 'muted'}, '—') : el('span', {class: 'mb-delta ' + dir(x)}, sgn(x, d, u));
const moneyDelta = (x, d = null, c = cur()) => x == null ? el('span', {class: 'muted'}, '—') : el('span', {class: 'mb-delta ' + dir(x)}, money(x, d, true, c));
const pad = n => String(n).padStart(2, '0');
const local = (iso, m = st.m) => new Date(Date.parse(iso) + P(m).offset_min * 60000);
const day = d => d.toISOString().slice(0, 10);
const hm = d => `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
const dateShort = (iso, m = st.m) => { const d = local(iso, m); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
function when(iso, m = st.m) { const d = local(iso, m), n = local(S.now, m); const z = P(m).zone; return day(d) === day(n) ? `${hm(d)} ${z}` : `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${hm(d)} ${z}`; }
const nowLabel = (m = st.m) => when(S.now, m);
/* as-of of an instrument: its source, the short stamp, stale when older than the source's own cadence allows */
function asOf(it) {
  const src = S.sources[it.source], d = local(it.as_of), n = local(S.now);
  const stale = (NOW - Date.parse(it.as_of)) / 3600000 > src.max_age_h;
  const short = it.source === 'eod' ? `EOD ${d.getUTCDate()} ${MON[d.getUTCMonth()]}` : it.source === 'snap3pm' ? (day(d) === day(n) ? '3 pm snap' : `3 pm ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`) : day(d) === day(n) ? hm(d) + ' ' + P().zone : `${d.getUTCDate()} ${MON[d.getUTCMonth()]} close`;
  return {short, stale, tip: `${src.label} (${src.detail}). As of ${when(it.as_of)}.${stale ? ' Stale: older than this source should be.' : ''}${it.note ? ' ' + it.note : ''} Not a live price.`};
}
const asOfEl = (it, withIcon = true) => { const a = asOf(it); return el('span', {class: 'mb-asof' + (a.stale ? ' stale' : ''), 'data-tip': a.tip}, withIcon ? icon(a.stale ? 'warning' : 'schedule') : null, a.short + (a.stale ? ' · stale' : '')); };
const item = id => P().items[id];
/* market session: open or closed now; your own buy and sell work only while it is open (owner, 13 Oct 2026). The
   strategies keep paper trading on their own schedule. #clock=open shows the same page during the session (example). */
function market(m = st.m) {
  const T = P(m).status, now = Date.parse(st.clock === 'open' ? T.example_open_now : S.now), o = Date.parse(T.open_utc), c = Date.parse(T.close_utc), z = P(m).zone;
  const at = iso => { const d = local(iso, m); return `${hm(d)} ${z}`; };
  if (now >= o && now < c) return {open: true, word: 'Open', text: `closes ${at(T.close_utc)}`};
  const next = now < o ? T.open_utc : T.next_open_utc;
  return {open: false, word: 'Closed', text: `opens ${now < o ? 'today' : dateShort(next, m)} ${at(next)}`, next};
}
const tradeLock = () => { const k = market(); return k.open ? null : `Market closed: you can buy and sell again when it ${k.text}. The strategies keep paper trading on their own.`; };
const isFno = it => it.kind === 'option' || it.kind === 'future';
const tradable = it => it.kind !== 'index';
const price = it => num(it.last, 2);
const paperTag = () => el('span', {class: 'mb-tag paper', 'data-tip': 'Paper: research and paper trading only. No real order, no real money.'}, 'Paper');
const mockTag = () => el('span', {class: 'mb-tag mock', 'data-tip': P().example_note}, 'Example data');

/* Our tools' reading in one neutral line. It stays grey: the verdict colours wait until the evidence is proven

function quickLine(c, S) {

    c.icon('query_stats'), `Our tools today: ${buy} of ${of} strategies buy · model ${h1.prob == null ? '—' : fmt(h1.prob * 100, 0) + '%'} (not proven) · AI team: ${ai}`);

/* The price chart (owner, 13 Oct 2026): hover or tap for a crosshair with the date, price and the comparisons; drag
   across (or pinch) to zoom, double-click or "Reset zoom" to go back; NIFTY 50 and the sector index to compare with;
   the model's 50% and 80% expected range for N+1..N+5 as a fan past the last close; open paper trades' buys marked. */
let ZOOM = null;   /* [from, to] indices within the period, or null */
const FAN = 5, CW = 640, CH = 330;

function priceChart(c, S) {
  const {el} = c, C = S.chart, n = Math.min(SPANS[PER][1], C.close.length - 1), start = C.close.length - 1 - n;
  const box = el('div', {class: 'pchart'}), tip = el('div', {class: 'xtip', role: 'status', 'aria-live': 'polite'});
  tip.hidden = true;
  const reset = el('button', {class: 'md-btn text small', type: 'button', hidden: !ZOOM, onclick: () => { ZOOM = null; draw(); }}, c.icon('close'), 'Reset zoom');
  const legend = el('div', {class: 'axis'});
  const series = () => {
    const [a, b] = ZOOM || [0, n], i0 = start + a, i1 = start + b, base = C.close[i0];
    const pick = arr => arr ? arr.slice(i0, i1 + 1) : null;
    return {i0, i1, base, own: pick(C.close), dates: pick(C.dates), bench: CMP ? pick(C.bench) : null, sector: SEC && C.sector ? pick(C.sector.close) : null, atEnd: i1 === C.close.length - 1};
  };
  function draw() {
    const D0 = series(), rel = CMP || SEC, norm = (v, arr) => v == null ? null : rel ? v / arr.find(x => x != null) * 100 : v;
    const lines = [['own', D0.own, 'var(--mb-chart-1)', '']].concat(D0.bench ? [['bench', D0.bench, 'var(--mb-chart-2)', '6 4']] : [], D0.sector ? [['sector', D0.sector, 'var(--mb-chart-3)', '2 3']] : []);
    const fan = D0.atEnd ? S.tools.horizons.map(h => ({h: h.h, d: h.target_date, lo80: h.lo80, hi80: h.hi80, lo50: h.lo50, hi50: h.hi50, mid: h.mid})) : [];
    const fanN = v => rel ? v / D0.base * 100 : v;
    const vals = lines.flatMap(([, arr]) => arr.map(v => norm(v, arr)).filter(v => v != null)).concat(fan.flatMap(f => [fanN(f.lo80), fanN(f.hi80)]));
    const lo = Math.min(...vals), hi = Math.max(...vals), hist = D0.own.length - 1, frac = fan.length ? 0.8 : 1;   /* the fan keeps 20% of the width, room for its numbers */
    const X = i => i <= hist ? i / (hist || 1) * CW * frac : CW * frac + (i - hist) / FAN * CW * (1 - frac), Y = v => CH - 10 - (v - lo) / (hi - lo || 1) * (CH - 20);
    const svg = c.svgEl('svg', {viewBox: `0 0 ${CW} ${CH}`, preserveAspectRatio: 'none', class: 'plot', role: 'img', style: `height:${CH}px`,
      'aria-label': `${S.ticker} from ${day(c, D0.dates[0])} to ${day(c, D0.dates.at(-1))}${fan.length ? ', with the model’s expected range for the next five sessions' : ''}`});
    if (fan.length) {   /* the fan: from the last close to each horizon's 80% and 50% bounds */
      const x0 = X(D0.own.length - 1), y0 = Y(norm(D0.own.at(-1), D0.own)), at = (k, key) => `${X(D0.own.length - 1 + k)},${Y(fanN(fan[k - 1][key]))}`;
      for (const [key, cls] of [['80', 'fan80'], ['50', 'fan50']]) {
        const up = fan.map((f, k) => at(k + 1, 'hi' + key)), down = fan.map((f, k) => at(k + 1, 'lo' + key)).reverse();
        svg.append(c.svgEl('polygon', {class: cls, points: [`${x0},${y0}`, ...up, ...down].join(' ')}));
      }
    }
    for (const [, arr, color, dash] of lines) {
      const runs = [[]]; arr.forEach((v, i) => v == null ? runs.push([]) : runs.at(-1).push(`${X(i).toFixed(1)},${Y(norm(v, arr)).toFixed(1)}`));
      for (const r of runs.filter(r => r.length > 1)) svg.append(c.svgEl('polyline', {points: r.join(' '), fill: 'none', stroke: color, 'stroke-width': '2', 'stroke-dasharray': dash, 'vector-effect': 'non-scaling-stroke'}));
    }
    for (const t of groupTrades(S.trades)) {   /* where the open paper trades bought */
      const i = D0.dates.indexOf(t.entry_date);
      if (i >= 0) svg.append(c.svgEl('circle', {class: 'entry', cx: X(i), cy: Y(rel ? t.entry / D0.base * 100 : t.entry), r: 4, 'vector-effect': 'non-scaling-stroke'}));
    }
    if (fan.length) svg.append(c.svgEl('polyline', {class: 'fanmid', points: [[0, D0.own.at(-1)], ...fan.map((f, k) => [k + 1, f.mid])].map(([k, v]) => `${X(hist + k)},${Y(fanN(v))}`).join(' '), 'vector-effect': 'non-scaling-stroke'}));
    const ov = el('div', {class: 'ov', 'aria-hidden': 'true'}), pos = (x, y) => `left:${(x / CW * 100).toFixed(2)}%;top:${(y / CH * 100).toFixed(2)}%`;
    if (fan.length) { const f = fan.at(-1);   /* the forecast's numbers at its end: 4-in-5 high, middle, 4-in-5 low */
      for (const [v, cls] of [[f.hi80, 'hi'], [f.mid, 'md'], [f.lo80, 'lo']]) ov.append(el('span', {class: 'fl ' + cls, style: `right:0;top:${(Y(fanN(v)) / CH * 100).toFixed(2)}%`}, fmt(v, 0))); }
    if (EX) for (const m of S.example_marks.marks) {   /* labelled example: the marks a proven family would draw */
      const b = D0.dates.indexOf(m.buy), s = D0.dates.indexOf(m.sell);
      if (b >= 0) ov.append(el('span', {class: 'mk buy', style: pos(X(b), Y(norm(m.buy_at, D0.own)))}, '▲', el('span', {class: 't'}, ' Buy')));
      if (s >= 0) ov.append(el('span', {class: 'mk sell ' + (m.ret >= 0 ? 'up' : 'down'), style: pos(X(s), Y(norm(m.sell_at, D0.own)))}, '▼', el('span', {class: 't'}, ` Sell ${pct(m.ret)}`)));
    }
    const cross = c.svgEl('line', {class: 'cross', y1: 0, y2: CH, hidden: true, 'vector-effect': 'non-scaling-stroke'}), sel = c.svgEl('rect', {class: 'sel', y: 0, height: CH, width: 0, hidden: true});
    svg.append(cross, sel);
    box.replaceChildren(svg, ov, tip);
    reset.hidden = !ZOOM;
    const ret = (D0.own.at(-1) / D0.base - 1) * 100;
    legend.replaceChildren(el('span', {}, day(c, D0.dates[0])),
      el('span', {class: 'keys'}, el('i', {class: 'k1'}), `${S.ticker} ${pct(ret)}`, D0.bench ? [el('i', {class: 'k2'}), C.bench_name] : null, D0.sector ? [el('i', {class: 'k3'}), C.sector.name] : null,
        fan.length ? [el('i', {class: 'kf'}), 'our forecast range, next 5 sessions'] : null, S.trades.length ? [el('i', {class: 'ke'}), 'paper buys'] : null),
      el('span', {}, fan.length ? `+5 sessions` : day(c, D0.dates.at(-1))));
    const fanTip = fx => { if (!fan.length || fx <= frac) return null; const h = S.tools.horizons[Math.min(4, Math.floor((fx - frac) / (1 - frac) * 5))];
      return `Forecast for ${day(c, h.target_date)}: middle ${fmt(h.mid)} · 1 in 2: ${fmt(h.lo50, 0)}–${fmt(h.hi50, 0)} · 4 in 5: ${fmt(h.lo80, 0)}–${fmt(h.hi80, 0)} (not proven)`; };
    interact(c, S, svg, cross, sel, tip, D0, X, fx => Math.round(Math.min(fx / frac, 1) * hist), draw, fanTip);
  }
  draw();
  return {box, legend, reset};
}

/* crosshair, drag-to-zoom, pinch-to-zoom and double-click reset on the chart's svg */
function interact(c, S, svg, cross, sel, tip, D0, X, toIndex, draw, fanTip) {
  const C = S.chart, idx = e => { const r = svg.getBoundingClientRect(); return Math.max(0, Math.min(D0.own.length - 1, toIndex((e.clientX - r.left) / r.width))); };
  const pts = new Map(); let drag = null, pinch = null;
  const show = i => {
    const g = D0.i0 + i, x = X(i); cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.hidden = false;
    const parts = [day(c, C.dates[g]), `${S.ticker} ${fmt(C.close[g])}`];
    if (D0.bench) parts.push(`${C.bench_name} ${fmt(C.bench[g])}`);
    if (D0.sector) parts.push(`${C.sector.name} ${C.sector.close[g] == null ? 'not recorded' : fmt(C.sector.close[g])}`);
    tip.textContent = parts.join(' · '); tip.hidden = false;
  };
  const zoomTo = (a, b) => { const lo = Math.max(0, Math.min(a, b)), hi = Math.min(D0.own.length - 1, Math.max(a, b)); if (hi - lo >= 4) { const off = (ZOOM || [0])[0]; ZOOM = [off + lo, off + hi]; draw(); } };
  svg.addEventListener('pointerdown', e => { pts.set(e.pointerId, e.clientX); svg.setPointerCapture(e.pointerId);
    if (pts.size === 2) { const [x1, x2] = [...pts.values()]; pinch = {d: Math.abs(x1 - x2), a: idx({clientX: Math.min(x1, x2)}), b: idx({clientX: Math.max(x1, x2)})}; drag = null; }
    else drag = {from: idx(e)}; });
  svg.addEventListener('pointermove', e => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, e.clientX);
    if (pinch && pts.size === 2) return;
    const r = svg.getBoundingClientRect(), ft = fanTip((e.clientX - r.left) / r.width);   /* inside the fan: that day's forecast */
    if (ft) { cross.hidden = true; tip.textContent = ft; tip.hidden = false; return; }
    const i = idx(e); show(i);
    if (drag && pts.size === 1 && Math.abs(i - drag.from) > 1) { sel.hidden = false; sel.setAttribute('x', X(Math.min(i, drag.from))); sel.setAttribute('width', Math.abs(X(i) - X(drag.from))); drag.to = i; }
  });
  const end = e => {
    if (pinch && pts.size === 2) { const [x1, x2] = [...pts.values()], k = Math.abs(x1 - x2) / (pinch.d || 1); if (k > 1.15) zoomTo(pinch.a, pinch.b); else if (k < 0.85) { ZOOM = null; draw(); } }
    else if (drag && drag.to != null) zoomTo(drag.from, drag.to);
    pts.delete(e.pointerId); if (!pts.size) { pinch = null; drag = null; sel.hidden = true; }
  };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('pointerleave', () => { if (!pts.size) { cross.hidden = true; tip.hidden = true; } });
  svg.addEventListener('dblclick', () => { ZOOM = null; draw(); });
}

/* a half dial from 0 to 100 with 30 and 70 marked, the needle at today's RSI */
function rsiDial(c, v) {
  const s = c.svgEl('svg', {viewBox: '0 0 120 68', class: 'dial', role: 'img', 'aria-label': v == null ? 'RSI not recorded' : `RSI ${fmt(v, 0)} on a scale of 0 to 100; 30 and 70 marked`});
  const pt = (val, r) => { const a = Math.PI * (1 - val / 100); return [60 + r * Math.cos(a), 62 - r * Math.sin(a)]; };
  const arc = (a, b, cls) => { const [x1, y1] = pt(a, 48), [x2, y2] = pt(b, 48); s.append(c.svgEl('path', {class: cls, d: `M${x1},${y1} A48,48 0 0 1 ${x2},${y2}`})); };
  arc(0, 30, 'hot'); arc(30, 70, 'calm'); arc(70, 100, 'hot');
  for (const m of [30, 70]) { const [x1, y1] = pt(m, 40), [x2, y2] = pt(m, 56); s.append(c.svgEl('line', {class: 'tick', x1, y1, x2, y2})); }
  if (v != null) { const [x, y] = pt(v, 42); s.append(c.svgEl('line', {class: 'needle', x1: 60, y1: 62, x2: x, y2: y}), c.svgEl('circle', {class: 'hub', cx: 60, cy: 62, r: 3.5})); }
  return s;
}

/* small bars, one per period; a second series (optional) drawn beside it; values below zero hang under the line */
function bars(c, rows, f, lbl, g, cls = 'rev') {
  const W = 300, H = 110, vals = rows.flatMap(r => [f(r), g ? g(r) : null]).filter(v => v != null);
  const s = c.svgEl('svg', {viewBox: `0 0 ${W} ${H + 16}`, class: 'plot bars mini', role: 'img', 'aria-label': rows.map(r => `${lbl(r)}: ${f(r) == null ? 'not recorded' : fmt(f(r), 1)}`).join('; ')});
  if (!vals.length) return s;
  const top = Math.max(0, ...vals), bot = Math.min(0, ...vals), Y = v => 4 + (top - v) / (top - bot || 1) * (H - 8), slot = W / rows.length, bw = slot * (g ? 0.32 : 0.56);
  rows.forEach((r, i) => { [[f(r), 0], [g ? g(r) : null, 1]].forEach(([v, k]) => { if (v == null) return;
      const x = i * slot + slot / 2 + (g ? (k ? 1 : -bw - 1) : -bw / 2);
      s.append(c.svgEl('rect', {class: v < 0 ? 'loss' : k ? 'prof' : cls, x, y: Math.min(Y(v), Y(0)), width: bw, height: Math.max(1, Math.abs(Y(v) - Y(0)))})); });
    const t = c.svgEl('text', {x: i * slot + slot / 2, y: H + 13, 'text-anchor': 'middle', class: 'lbl'}); t.textContent = lbl(r); s.append(t); });
  s.append(c.svgEl('line', {class: 'zero', x1: 0, x2: W, y1: Y(0), y2: Y(0)}));
  return s;
}

/* small lines for percentages (margins), each point labelled */
function lines(c, rows, fs, lbl) {

  const s = c.svgEl('svg', {viewBox: `0 0 ${W} ${H + 16}`, class: 'plot bars mini', role: 'img', 'aria-label': rows.map(r => `${lbl(r)}: ${fs.map(f => f(r) == null ? '—' : fmt(f(r), 1) + '%').join(', ')}`).join('; ')});
  const slot = W / rows.length, X = i => i * slot + slot / 2, Y = v => 14 + (hi - v) / (hi - lo || 1) * (H - 22);
  fs.forEach((f, k) => { const pts = rows.map((r, i) => f(r) == null ? null : `${X(i)},${Y(f(r))}`).filter(Boolean);
    if (pts.length > 1) s.append(c.svgEl('polyline', {class: k ? 'mline2' : 'mline', points: pts.join(' ')}));
    if (!k) rows.forEach((r, i) => { if (f(r) == null) return; const t = c.svgEl('text', {x: X(i), y: Y(f(r)) - 6, 'text-anchor': 'middle', class: 'mval'}); t.textContent = fmt(f(r), 1); s.append(t); }); });
  rows.forEach((r, i) => { const t = c.svgEl('text', {x: X(i), y: H + 13, 'text-anchor': 'middle', class: 'lbl'}); t.textContent = lbl(r); s.append(t); });
  return s;
}

/* profit or loss at expiry of buying one lot, over ±12% of today's price: loss capped at the price paid */
function payoff(c, k, prem, kind, lot, spot) {

  const X = s => (s - lo) / (hi - lo) * W, Y = v => H - 8 - (v - ymin) / (ymax - ymin || 1) * (H - 16);
  const svg = c.svgEl('svg', {viewBox: `0 0 ${W} ${H}`, class: 'plot bars payoff', role: 'img', 'aria-label': `Buying one lot: the most you can lose is ${fmt(prem * lot, 0)}; it makes money ${kind === 'ce' ? 'above' : 'below'} ${fmt(kind === 'ce' ? k + prem : k - prem)}`});
  svg.append(c.svgEl('rect', {class: 'gain', x: 0, y: 0, width: W, height: Y(0)}), c.svgEl('line', {class: 'zero', x1: 0, x2: W, y1: Y(0), y2: Y(0)}));
  svg.append(c.svgEl('polyline', {class: 'payl', points: xs.map((s, i) => `${X(s).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ')}));
  svg.append(c.svgEl('line', {class: 'spot', x1: X(spot), x2: X(spot), y1: 0, y2: H}));
  for (const [v, t, y] of [[ymin, `−${fmt(-ymin, 0)} most you can lose`, Y(ymin) - 4], [ymax, `+${fmt(ymax, 0)} at ${fmt(kind === 'ce' ? hi : lo, 0)}`, Y(ymax) + 12]]) {
    const tx = c.svgEl('text', {x: kind === 'ce' ? 4 : W - 4, y, 'text-anchor': kind === 'ce' ? 'start' : 'end', class: 'lbl'}); tx.textContent = t; svg.append(tx); }
  return svg;
}

    CMP = h.get('cmp') === '1'; SEC = h.get('sec') === '1'; RES = h.get('res') === 'y' ? 'y' : 'q'; EX = ['win', 'lose'].includes(h.get('ex')) ? h.get('ex') : null; PF.st.wlOff = h.get('wloff') !== '0'; },
  writeHash(h) { if (TAB !== 'overview') h.set('tab', TAB); if (PER !== '1y') h.set('per', PER); if (CMP) h.set('cmp', '1'); if (SEC) h.set('sec', '1');
    if (RES === 'y') h.set('res', 'y'); if (EX) h.set('ex', EX); if (!PF.st.wlOff) h.set('wloff', '0'); },
  render(main, c) {
    const S = D.markets[c.m], {el} = c, it = c.item(S.ticker);
    LOC = c.m === 'india' ? 'en-IN' : 'en-US';
    if (TAB === 'fno' && !S.fno) TAB = 'overview';
    header(main, c, S, it);
    main.append(el('div', {class: 'md-segmented tabs', role: 'tablist', 'aria-label': 'Sections'}, ...TABS.filter(t => t[0] !== 'fno' || S.fno).map(([k, v]) => el('button', {type: 'button', role: 'tab', 'aria-selected': String(TAB === k), 'aria-pressed': String(TAB === k), onclick: () => { TAB = k; c.rerender(); }}, v))));
    ({overview, tools, news, results, fno: fnoTab})[TAB](main, c, S);
    main.append(el('div', {class: 'src', role: 'note', 'aria-label': 'Where the figures come from'},
      el('span', {class: 'mb-asof', 'data-tip': D.source}, c.icon('schedule'), 'The stock tool’s records'),
      S.fno ? el('span', {class: 'mb-asof', 'data-tip': 'NSE’s daily F&O files'}, c.icon('schedule'), `NSE F&O close of ${c.dateShort(S.fno.date + 'T10:00:00Z')}`) : null,
      el('span', {class: 'mb-tag derived', 'data-tip': 'Returns, 52-week figures, volatility, the trailing P/E, growth and margins, the agreement counts, build-up and IV: computed by us'}, 'Computed: ours'),
      el('span', {class: 'mb-tag', 'data-tip': 'No streaming prices: closes and the stock tool’s price checks.'}, 'Not live')));
  }});

</script>
