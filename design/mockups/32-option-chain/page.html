.mb-drawer-sub { font: 600 14px/20px var(--md-ref-typeface-plain); margin: 18px 0 8px; }
.mb-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mb-fact { display: grid; gap: 1px; padding: 8px 10px; border-radius: var(--mb-panel-radius); background: var(--md-sys-color-surface-container-low); min-width: 0; }
.mb-fact .k { font: 600 11px/16px var(--md-ref-typeface-plain); letter-spacing: .04em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); }
.mb-fact b { font: 700 16px/22px var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums; } .mb-fact small { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }

/* ---- screener (design/mockups/33-screener; PLATFORM_DESIGN.md section 4 screen 8) ----------------------------------
   .mb-scr-look (tiles: today in one look; a tile that is a button applies its screen), .mb-breadth (up, unchanged,
   down), .mb-scr-presets (ready-made screens: chips with their counts), .mb-scr-filters (number filters),
   .mb-scr-wrap > table.mb-scr (results, sortable headers; the wrap is a size container: .c-l columns drop under 1000 px of
   it) and ul.mb-scr-cards (the same results as cards under 760 px of it),
   .mb-pos52 (where a value sits in its range: 52-week, or IV in its 3-month range), .mb-scr-tools (the tools' view). */
.mb-scr-look { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; margin-top: 4px; }
.mb-scr-tile { display: grid; gap: 4px; align-content: start; text-align: left; padding: 12px 14px; border-radius: var(--mb-card-radius); border: 1px solid transparent; background: var(--md-sys-color-surface-container-lowest); box-shadow: var(--mb-card-shadow); color: var(--md-sys-color-on-surface); font: inherit; min-width: 0; }
button.mb-scr-tile { cursor: pointer; } button.mb-scr-tile:hover { border-color: var(--md-sys-color-outline-variant); }
.mb-scr-tile[aria-pressed="true"] { border-color: var(--md-sys-color-primary); box-shadow: inset 0 0 0 1px var(--md-sys-color-primary); }
.mb-scr-tile .k { font: 600 12px/16px var(--md-ref-typeface-plain); color: var(--md-sys-color-on-surface-variant); }
.mb-scr-tile b { font: 700 20px/26px var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums; }
.mb-scr-tile small { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }
.mb-breadth { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.mb-breadth i { display: block; min-width: 2px; } .mb-breadth .up { background: var(--mb-color-up); } .mb-breadth .down { background: var(--mb-color-down); } .mb-breadth .flat { background: var(--md-sys-color-outline-variant); }
.mb-scr-presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 16px; }
.mb-scr-presets .lbl { font: 600 12px/16px var(--md-ref-typeface-plain); color: var(--md-sys-color-on-surface-variant); margin-right: 4px; }
.mb-scr-presets .md-chip .n { font-weight: 700; color: var(--md-sys-color-primary); margin-left: 2px; }
.mb-scr-presets .md-chip[aria-pressed="true"] .n { color: inherit; }
.mb-scr-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px 12px; align-items: end; padding: 12px 14px; border-radius: var(--mb-card-radius); background: var(--md-sys-color-surface-container-lowest); box-shadow: var(--mb-card-shadow); }
.mb-scr-filters .mb-field > span { font: 600 12px/16px var(--md-ref-typeface-plain); color: var(--md-sys-color-on-surface-variant); }
.mb-scr-wrap { container-type: inline-size; background: var(--md-sys-color-surface-container-lowest); border-radius: var(--mb-card-radius); box-shadow: var(--mb-card-shadow); }
.mb-scr th { position: sticky; top: var(--mb-appbar-height); z-index: 2; }
.mb-scr th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.mb-scr th button:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }
.mb-scr th .ms { width: 14px; height: 14px; }
.mb-scr td small { display: block; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.mb-scr td .nm, .mb-scr-cards .nm { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.mb-scr td.act { text-align: right; white-space: nowrap; }
.mb-pos52 { display: inline-grid; grid-template-columns: auto 72px auto; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.mb-pos52 .track { position: relative; display: block; width: 72px; height: 6px; border-radius: 3px; background: var(--md-sys-color-surface-container-high); }
.mb-pos52 .track i { position: absolute; top: -3px; width: 4px; height: 12px; margin-left: -2px; border-radius: 2px; background: var(--md-sys-color-primary); }
.mb-pos52 small { display: inline; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.mb-scr-tools { display: grid; gap: 0; } .mb-scr-tools b { font-weight: 600; } .mb-scr-tools small { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.mb-scr-cards { display: none; list-style: none; margin: 0; padding: 0; }
.mb-scr-cards li { display: grid; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--md-sys-color-surface-container-high); }
.mb-scr-cards li:first-child { border-top: 0; }
.mb-scr-cards .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mb-scr-cards .px { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mb-scr-cards small { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.mb-scr-cards .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; }
@container (max-width: 1000px) { .mb-scr .c-l { display: none; } }
@container (max-width: 760px) { .mb-scr-wrap > .mb-scr { display: none; } .mb-scr-cards { display: block; } }

/* ---- market overview (design/mockups/34-markets; PLATFORM_DESIGN.md section 4 screen 2) ----------------------------
   .mb-heat (tiles: a name, its change with the sign, one line), .mb-heat-tile.up/.down with strength .s1-.s3 (the
   shade deepens with the size of the move; the sign and number always carry the meaning, never colour alone), .plain
   for neutral tiles; .mb-flowbar.in/.out (net buying or selling as a bar with its value), ul.mb-flows rows. */
.mb-heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px; }
.mb-heat-tile { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--mb-panel-radius); background: var(--md-sys-color-surface-container-low); min-width: 0; }
.mb-heat-tile .n { font: 600 12.5px/17px var(--md-ref-typeface-plain); overflow-wrap: anywhere; }
.mb-heat-tile b { font: 700 16px/22px var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums; }
.mb-heat-tile small { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }
.mb-heat-tile.up.s1 { background: color-mix(in srgb, var(--mb-color-up-container) 55%, var(--md-sys-color-surface-container-lowest)); }
.mb-heat-tile.up.s2 { background: var(--mb-color-up-container); }
.mb-heat-tile.up.s3 { background: color-mix(in srgb, var(--mb-color-up) 22%, var(--mb-color-up-container)); }
.mb-heat-tile.down.s1 { background: color-mix(in srgb, var(--mb-color-down-container) 55%, var(--md-sys-color-surface-container-lowest)); }
.mb-heat-tile.down.s2 { background: var(--mb-color-down-container); }
.mb-heat-tile.down.s3 { background: color-mix(in srgb, var(--mb-color-down) 22%, var(--mb-color-down-container)); }
.mb-heat-tile.up b { color: var(--mb-color-on-up-container); } .mb-heat-tile.down b { color: var(--mb-color-on-down-container); }
.mb-flowbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font: 600 12.5px/18px var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums; }
.mb-flowbar i { display: block; height: 8px; border-radius: 4px; min-width: 2px; }
.mb-flowbar.in i { background: var(--mb-color-up); } .mb-flowbar.out i { background: var(--mb-color-down); }
.mb-flowbar.in > span { color: var(--mb-color-on-up-container); } .mb-flowbar.out > span { color: var(--mb-color-on-down-container); }
ul.mb-flows li { grid-template-columns: 76px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; }
@media (max-width: 599px) { ul.mb-flows li { grid-template-columns: 1fr; } }

/* ---- stock page (design/mockups/35-stock; PLATFORM_DESIGN.md section 4 screen 4) ---------------------------------
   .mb-fanbar: an expected price range on one scale shared by its rows: .b80 (80% range), .b50 (50% range, inside it)
   and .now (today's price); the numbers are always written beside it. */
.mb-fanbar { position: relative; display: block; width: 100%; min-width: 120px; height: 14px; border-radius: 3px; background: var(--md-sys-color-surface-container); margin: 4px 0 2px; }
.mb-fanbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.mb-fanbar .b80 { background: var(--mb-chart-band-80); }
.mb-fanbar .b50 { top: 3px; bottom: 3px; background: var(--mb-chart-1); opacity: .55; }
.mb-fanbar .now { width: 2px; margin-left: -1px; top: -3px; bottom: -3px; background: var(--md-sys-color-on-surface); border-radius: 1px; }
.mb-fan td small { display: block; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

</style>

/* Omenix platform runtime, part 1 of 7 (files design/mockups/_platform/js/*.js, concatenated in file order by platform_build.py
   into one script). The runtime of the design mockups (design/PLATFORM_DESIGN.md sections 2, 3, 5 and 6).
   A page defines `const SHELL = ...30-shell/data.json...` and `const D = ...its own data.json...`, then this script,
   then calls PF.mount({screen, group, render(main, ctx)}). The shell draws the app bar (brand, global search, market
   switch, index strip, bell, theme, profile), the navigation rail (groups with flyouts, pinned screens), the
   picks panel (today’s buy picks by strategy family with their real figures; filter chips, pages, B / S on every row), the hover card, the context
   menu, the command palette, the shortcuts list, the right drawer (Paper order window, quick view; a bottom sheet on
   phones) and the phone bottom tabs. Every class is a component of design/system/components.css; this file holds
   behaviour only. The URL hash holds the state (m, theme, wl, density, rail, drawer, pal, keys, hc, menu, fly, notif,
   wlopen, ap, pg, fno), so Back, Forward and bookmarks work and every screenshot state is a link. Paper only: the order window
   records a paper order in the dashboard's inbox; nothing here places, modifies or cancels a real order. */
'use strict';
const PF = (() => {
const S = SHELL;

const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); } return n; };

/* ---- state and the URL ------------------------------------------------------------------------------------- */
const st = {clock: 'now', m: 'india', theme: 'light', wl: 0, ap: 'all', pg: 0, fno: 'today', density: 'comfortable', rail: 'labels', wlOff: false, drawer: null, pal: null, keys: false, hc: null, menu: null, fly: null, notif: false, wlopen: false};
let page = null, lastFocus = null;
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('m') in S.markets) st.m = h.get('m');
  st.clock = h.get('clock') === 'open' ? 'open' : 'now';
  if (['light', 'dark', 'system'].includes(h.get('theme'))) st.theme = h.get('theme');
  if (['rule', 'ai', 'hybrid'].includes(h.get('ap'))) st.ap = h.get('ap');
  st.pg = Math.max(0, (+h.get('pg') || 1) - 1); st.fno = h.get('fno') === 'example' ? 'example' : 'today';

}
function writeHash() {
  const h = new URLSearchParams();
  if (st.m !== 'india') h.set('m', st.m);
  if (st.clock === 'open') h.set('clock', 'open');
  if (st.theme !== 'light') h.set('theme', st.theme);
  if (st.ap !== 'all') h.set('ap', st.ap);
  if (st.pg) h.set('pg', st.pg + 1);
  if (st.fno !== 'today') h.set('fno', st.fno);

  if (st.rail !== 'labels') h.set('rail', st.rail);

/* ---- formatting --------------------------------------------------------------------------------------------- */
const LOC = {INR: 'en-IN', USD: 'en-US'}, SYM = {INR: '₹', USD: '$'};
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const P = (m = st.m) => S.markets[m];
const cur = () => P().currency;
const num = (x, d = 2, c = cur()) => x == null ? '—' : Math.abs(x).toLocaleString(LOC[c], {minimumFractionDigits: d, maximumFractionDigits: d});

const sgn = (x, d = 2, u = '%') => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d) + u;
const dir = x => x > 0 ? 'up' : x < 0 ? 'down' : 'flat';
const delta = (x, d = 2, u = '%') => x == null ? el('span', {class: 'muted'}, '—') : el('span', {class: 'mb-delta ' + dir(x)}, sgn(x, d, u));

const nowLabel = (m = st.m) => when(S.now, m);
/* as-of of an instrument: its source, the short stamp, stale when older than the source's own cadence allows */
function asOf(it) {
  const src = S.sources[it.source], d = local(it.as_of), n = local(S.now);
  const stale = (NOW - Date.parse(it.as_of)) / 3600000 > src.max_age_h;
  const short = it.source === 'eod' ? `EOD ${d.getUTCDate()} ${MON[d.getUTCMonth()]}` : it.source === 'snap3pm' ? (day(d) === day(n) ? '3 pm snap' : `3 pm ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`) : day(d) === day(n) ? hm(d) + ' ' + P().zone : `${d.getUTCDate()} ${MON[d.getUTCMonth()]} close`;
  return {short, stale, tip: `${src.label} (${src.detail}). As of ${when(it.as_of)}.${stale ? ' Stale: older than this source should be.' : ''}${it.note ? ' ' + it.note : ''} Not a live price.`};
}
const asOfEl = (it, withIcon = true) => { const a = asOf(it); return el('span', {class: 'mb-asof' + (a.stale ? ' stale' : ''), 'data-tip': a.tip}, withIcon ? icon(a.stale ? 'warning' : 'schedule') : null, a.short + (a.stale ? ' · stale' : '')); };
const item = id => P().items[id];
/* market session: open or closed now; your own buy and sell work only while it is open (owner, 13 Oct 2026). The
   strategies keep paper trading on their own schedule. #clock=open shows the same page during the session (example). */
function market(m = st.m) {
  const T = P(m).status, now = Date.parse(st.clock === 'open' ? T.example_open_now : S.now), o = Date.parse(T.open_utc), c = Date.parse(T.close_utc), z = P(m).zone;
  const at = iso => { const d = local(iso, m); return `${hm(d)} ${z}`; };
  if (now >= o && now < c) return {open: true, word: 'Open', text: `closes ${at(T.close_utc)}`};
  const next = now < o ? T.open_utc : T.next_open_utc;

}

  let x = side === 'right' ? r.right + gap : r.left, y = side === 'right' ? r.top : r.bottom + 6;
  if (side === 'right' && x + w > innerWidth - 8) x = r.left - w - gap;
  if (x < 8 || x + w > innerWidth - 8) { x = Math.max(8, Math.min(innerWidth - w - 8, r.left)); y = r.bottom + 6; }
  if (y + h > innerHeight - 8) y = Math.max(8, (side === 'right' ? r.bottom : r.top - 6) - h);
  box.style.left = x + 'px'; box.style.top = y + 'px';
}

  return el('div', {}, seg(c, 'History', Object.entries(SPANS).map(([key, v]) => [key, v[0]]), CR, key => { CR = key; c.openDrawer('page:' + code); }), s,
    el('div', {class: 'axis'}, el('span', {}, dayOf(c, d0)), el('span', {}, `price ${num(lo)}–${num(hi)} · bars: open interest`), el('span', {}, dayOf(c, C.day))),
    el('p', {class: 'muted', style: 'font-size:12px;margin:4px 0 0'}, `Listed ${dayOf(c, H.dates[h.from])}${H.dates[h.from] === C.source.history_from ? ' or earlier (these files start 1 Jun)' : ''}; the line skips days without trades.`));
}
</script>
