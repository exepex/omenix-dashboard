<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omenix · Platform shell</title>
<meta name="description" content="The frame every Omenix screen sits in: app bar with global search, market switch and index strip; navigation rail; Kite-style watchlist panel; right drawer with the Paper order window; hover cards; command palette; phone bottom tabs. Mock data, research and paper trading only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* 30-shell page layout only (the shell parts themselves are components of design/system/components.css). Tokens only. */
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.part{display:grid;grid-template-rows:auto 1fr auto;gap:10px}
.part .t{display:flex;align-items:center;gap:12px}
.part .t h2{font:600 16px/1.3 var(--md-ref-typeface-plain);margin:0}
.part p{margin:0;font-size:13.5px;color:var(--md-sys-color-on-surface-variant)}
.part .try{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline-tk{display:flex;flex-wrap:wrap;gap:10px;font-size:13.5px}
@media (max-width:599px){.src .ex{display:none}}
.src td small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:12px}
.honest{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.honest li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13.5px}
.honest li b{display:block}
@media (max-width:1100px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:599px){.parts{grid-template-columns:1fr}}
</style>
</head>
<body>
<!--@@ICONS@@-->
<script>const SHELL = /*__SHELL__*/null; const D = /*__DATA__*/null;</script>
<!--@@PLATFORM_JS@@-->
<script>
PF.mount({screen: 'shell', group: null, render(main, c) {
  const {el, icon, inst, P} = c;
  const india = P.fno;
  main.append(c.pagehead({crumbs: [['Design system', '../../system/styleguide.html'], ['Platform shell']], title: 'Platform shell',
    meta: [c.mockTag(), el('span', {class: 'mb-asof', 'data-tip': 'The mockups run on a fixed clock so every build gives the same page.'}, icon('schedule'), 'Mock clock ' + c.nowLabel())],
    actions: [el('button', {class: 'md-btn outlined', type: 'button', onclick: () => c.openPal('')}, icon('search'), 'Search', el('span', {class: 'mb-kbd'}, '/')),
              el('button', {class: 'md-btn filled', type: 'button', onclick: () => c.openOrder(india ? 'RELIANCE' : 'AAPL', 'buy')}, icon('receipt_long'), 'New order')]}));

  const part = (ic, tone, title, text, ...tries) => el('section', {class: 'card part'}, el('div', {class: 't'}, el('span', {class: 'mb-avatar ' + tone}, icon(ic)), el('h2', {}, title)), el('p', {}, text), el('div', {class: 'try'}, ...tries));
  const btn = (label, fn, cls = 'md-btn outlined small', ic) => el('button', {class: cls, type: 'button', onclick: fn}, ic ? icon(ic) : null, label);
  const firstTk = india ? ['RELIANCE', 'NIFTY26OCT22800CE', 'HDFCBANK', 'NIFTY26NOV22000PE'] : ['NVDA', 'AAPL', 'JPM'];
  main.append(el('div', {class: 'parts'},
    part('search', 'primary', 'Global search', `The only search box: ${india ? 'a stock, an index, or an option by its words (nifty 22800 call) or its exchange code (NIFTY26OCT22800CE)' : 'a stock or company'}, plus strategies, news and pages. Every stock and contract result has B and S. Press / or Ctrl K anywhere.`,
      btn('Open search', () => c.openPal(''), undefined, 'search'), btn(india ? 'Try “NIFTY26OCT22800CE”' : 'Try “nvidia”', () => c.openPal(india ? 'NIFTY26OCT22800CE' : 'nvidia'))),
    part('public', 'info', 'Market switch and status', (india ? 'India shows stocks and F&O; in the US every F&O element is absent, not empty.' : 'US: stocks only.') + ' Beside it: whether the market is open or closed, and when that changes; your own buy and sell are paused while it is closed. Currencies are never summed.',
      btn(india ? 'Switch to US' : 'Switch to India', () => { c.st.m = india ? 'us' : 'india'; c.st.wl = 0; c.rerender(); })),
    part('monitoring', 'neutral', 'Index strip', `${P.indices.map(id => c.item(id).sym).join(', ')}. Hover any index for its as-of time and source. Stale values turn grey and say “stale”.`,
      el('span', {class: 'muted', style: 'font-size:12.5px'}, 'Top bar, right of the market switch; on a phone, a row under the search.')),
    part('dashboard', 'primary', 'Navigation rail', 'Seven groups (Dashboard, Markets, Trade, Portfolio, Strategies, Research, Control) plus Assistant, Help and Settings. Hover or focus a group for its screens; pinned screens sit below.',
      btn(c.st.rail === 'icons' ? 'Show labels' : 'Icons only', () => { c.st.rail = c.st.rail === 'icons' ? 'labels' : 'icons'; c.rerender(); })),
    part('bolt', 'warn', 'Today’s buy picks panel', 'Left bar on desktop, “Picks” tab on a phone: each approach’s pick for today (rule-based, AI team, hybrid) with how many strategies agree, the model’s chance, Yes or No after market costs and the strategy’s record on that stock. Buy and Sell on every row while the market is open.',
      btn('Rule-based only', () => { c.st.ap = 'rule'; c.rerender(); }), btn('All', () => { c.st.ap = 'all'; c.rerender(); })),
    part('open_in_new', 'info', 'Hover cards', 'Every ticker and contract is a link. Hover (or tap) for price, change, as-of, your position and Chart, Chain, Buy, Sell:',
      el('div', {class: 'inline-tk'}, ...firstTk.map(id => inst(id)))),
    part('more_vert', 'neutral', 'Context menu', `The same small menu on every row: Chart, ${india ? 'Option chain, ' : ''}Buy or sell, Add to watchlist, News, Open details, Set an alert.`,
      btn('Open a row menu', e => c.openMenu(firstTk[0], e.currentTarget), undefined, 'more_vert')),
    part('receipt_long', 'paper', 'Order window', (india ? 'Manual paper account only; checks against its limits before confirming; F&O refused where our data has no executable quote.' : 'Manual paper account only; checks cash and holdings before confirming.') + ' Locked while the market is closed.',
      ...(india ? [btn('Stock buy', () => c.openOrder('RELIANCE', 'buy'), 'md-btn small buy'), btn('Option buy (passes)', () => c.openOrder('NIFTY26OCT23300CE', 'buy')), btn('Option sell (blocked)', () => c.openOrder('NIFTY26OCT22800CE', 'sell')), btn('Future (refused)', () => c.openOrder('NIFTY26OCTFUT', 'buy'))]
                 : [btn('Stock buy', () => c.openOrder('NVDA', 'buy'), 'md-btn small buy'), btn('Sell held shares', () => c.openOrder('AAPL', 'sell'), 'md-btn small sell')])),
    part('dock_to_left', 'primary', 'Right drawer and bottom sheet', 'Orders and quick views open without leaving the page: from the right on desktop, as a bottom sheet on a phone. Esc closes; focus returns where it was.',
      btn('Quick view', () => c.openDrawer('quick:' + firstTk[0]))),
    part('menu', 'neutral', 'Phone bottom tabs', 'Home, Watchlist, Orders, Portfolio, More. Search stays at the top of every screen; More lists every screen.',
      btn('All screens', () => c.openDrawer('nav'))),
    part('dark_mode', 'neutral', 'Light and dark', 'Light by default; dark from the same tokens (every text pair WCAG AA). The choice can also follow the system, in the profile menu.',
      btn(document.documentElement.dataset.theme === 'dark' ? 'Light theme' : 'Dark theme', () => { c.st.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; c.rerender(); })),
    part('keyboard', 'neutral', 'Keyboard', '/ search, B and S on a focused row, Esc closes, g then h, p, o or s to jump, ? lists them all. Every shortcut also has a button.',
      btn('Shortcuts', () => c.openKeys(), undefined, 'keyboard'))));

  /* where the frame's prices come from */
  const srcRows = {};
  for (const it of Object.values(P.items)) (srcRows[it.source] ||= []).push(it);
  const tbl = el('table', {class: 'md-table tbl src'}, el('thead', {}, el('tr', {}, el('th', {}, 'Source'), el('th', {class: 'ex'}, 'Example'), el('th', {class: 'num'}, 'As of'))),
    el('tbody', {}, ...Object.entries(srcRows).map(([k, items]) => { const s = c.S.sources[k], ex = items.find(i => c.asOf(i).stale) || items[0];
      return el('tr', {}, el('td', {}, el('b', {}, s.label), el('small', {}, `${s.detail}. Used for ${items.length} instrument${items.length === 1 ? '' : 's'} (${[...new Set(items.map(i => i.kind))].join(', ')}).`)), el('td', {class: 'ex'}, inst(ex.id)), el('td', {class: 'num'}, c.asOfEl(ex))); })));
  main.append(el('div', {class: 'grid'},
    el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'Where the prices in the frame come from'), el('span', {class: 'end'}, c.mockTag())), el('div', {class: 'md-table-wrap'}, tbl),
      el('p', {class: 'note'}, 'No live feed: a value is as fresh as its source. A value older than its source allows turns grey and says “stale”.')),
    el('section', {class: 'card'}, el('div', {class: 'head'}, el('h2', {}, 'What a broker has that Omenix does not')),
      el('ul', {class: 'honest'},
        el('li', {}, el('span', {class: 'mb-mark na'}, icon('remove')), el('span', {}, el('b', {}, 'Streaming prices'), 'Every price carries its as-of time. A live feed is a separate, priced decision.')),
        el('li', {}, el('span', {class: 'mb-mark no'}, icon('close')), el('span', {}, el('b', {}, 'Real orders'), 'Never. Orders are Paper: on the button, the confirmation and every result.')),
        el('li', {}, el('span', {class: 'mb-mark na'}, icon('remove')), el('span', {}, el('b', {}, 'Market depth'), india ? 'Not recorded. Best bid and ask only, from the 3 pm NIFTY snapshot, with its time.' : 'Not recorded: no order book in our data.')),
        el('li', {}, el('span', {class: 'mb-mark na'}, icon('remove')), el('span', {}, el('b', {}, 'Mutual funds, IPOs, bonds'), 'Out of scope; not shown.'))))));
}});
</script>
</body>
</html>
